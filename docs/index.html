  -webkit-backdrop-filter: blur(10px);
}

.type-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(143, 240, 255, 0.09), rgba(192, 132, 252, 0.06));
}

.type-card::before {
  content: "";
  position: absolute;
  top: -90px;
  right: -80px;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(143, 240, 255, 0.18), transparent 70%);
  pointer-events: none;
}

.type-kicker {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.22em;
}

.type-name {
  position: relative;
  margin: 10px 0 5px;
  color: var(--era-accent-2);
  font-size: clamp(38px, 5.5vw, 64px);
  line-height: 1;
  letter-spacing: -0.045em;
}

.type-en {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.type-desc {
  position: relative;
  max-width: 46ch;
  margin: 17px 0 0;
  color: var(--era-text);
  font-size: 13px;
  line-height: 1.8;
}

.type-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 17px;
}

.stat {
  min-width: 88px;
  padding: 7px 9px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
}

.stat b {
  display: block;
  margin-top: 3px;
  color: var(--era-text);
  font-size: 14px;
}

.radar-card {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.radar-title,
.poster-title {
  align-self: flex-start;
  margin-bottom: 6px;
  color: var(--era-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.radar-canvas {
  width: 100%;
  max-width: 360px;
  height: auto;
  aspect-ratio: 1;
}

.era-bars {
  display: grid;
  gap: 9px;
}

.bar-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 34px;
  gap: 8px;
  align-items: center;
}

.bar-label {
  color: var(--era-muted);
  font-size: 9px;
  white-space: nowrap;
}

.bar-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--era-accent), var(--era-accent-2));
  transition: width 1s ease;
}

.bar-val {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  text-align: right;
}

.best-era {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 13px;
  padding: 11px;
  border: 1px solid var(--era-line);
  border-radius: 11px;
}

.best-icon {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border: 1px solid var(--era-accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--era-accent);
  background: rgba(143, 240, 255, 0.06);
}

.best-icon svg {
  width: 19px;
  height: 19px;
}

.best-meta {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.best-label {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
}

.best-name {
  font-size: 14px;
  font-weight: 700;
}

.best-why {
  margin-top: 7px;
  color: var(--era-muted);
  font-size: 10px;
  line-height: 1.6;
}

.keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 11px;
}

.keyword {
  padding: 4px 7px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-accent-2);
  font-size: 9px;
}

.poster-card {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.poster-preview {
  display: block;
  width: 100%;
  max-width: 330px;
  height: auto;
  border: 1px solid var(--era-line);
  border-radius: 10px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 22px;
}

.share-box {
  display: flex;
  gap: 5px;
  margin-top: 11px;
  width: 100%;
}

.share-input {
  flex: 1;
  min-width: 0;
  height: 34px;
  padding: 0 8px;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
}

.result-quote {
  max-width: 760px;
  margin: 28px auto 0;
  color: var(--era-text);
  font-size: clamp(17px, 2.6vw, 23px);
  line-height: 1.6;
  text-align: center;
}

.result-quote span {
  color: var(--era-accent-2);
}

.result-foot {
  margin-top: 23px;
  color: var(--era-muted);
  font-size: 10px;
  line-height: 1.8;
  text-align: center;
  opacity: 0.85;
}

/* =========================================================
   future
   ========================================================= */
#screen-future {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  place-items: center;
  background: #000;
}

#future-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.future-inner {
  position: relative;
  z-index: 1;
  padding: 24px;
  text-align: center;
}

.future-kicker {
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
}

.future-inner h2 {
  margin: 14px 0 9px;
  font-size: clamp(30px, 6vw, 64px);
  line-height: 1.08;
  letter-spacing: -0.04em;
}

.future-inner p {
  margin: 0 0 24px;
  color: var(--era-muted);
  font-size: 14px;
}

/* =========================================================
   countdown · agent takeover · finale
   ========================================================= */
body[data-era="finale"] {
  --era-bg: #05070b;
  --era-bg-2: #0b0a14;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #eef2f8;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.22);
  --era-panel: rgba(255, 255, 255, 0.03);
}

.countdown {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  padding: 6px 12px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.28);
  font-family: var(--font-mono);
}

.countdown .cd-label {
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--era-muted);
}

.countdown .cd-value {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--era-text);
  font-variant-numeric: tabular-nums;
}

.countdown.is-warning {
  border-color: rgba(224, 164, 88, 0.6);
}

.countdown.is-warning .cd-value {
  color: #e0a458;
}

.countdown.is-critical {
  border-color: rgba(255, 139, 139, 0.7);
  animation: cdPulse 1s ease-in-out infinite;
}

.countdown.is-critical .cd-value {
  color: #ff8b8b;
}

@keyframes cdPulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255, 139, 139, 0);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(255, 139, 139, 0.14);
  }
}

.agent-banner {
  position: fixed;
  left: 50%;
  top: calc(var(--topbar-h) + 14px);
  z-index: 46;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 14px;
  border: 1px solid rgba(192, 132, 252, 0.55);
  border-radius: 999px;
  background: rgba(10, 8, 20, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
  color: #e6d5ff;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  transform: translateX(-50%);
  animation: agentIn 0.4s ease both;
}

.agent-banner .ab-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c084fc;
  box-shadow: 0 0 12px #c084fc;
  animation: blink 1.1s steps(2, start) infinite;
}

.agent-banner .ab-cancel {
  padding: 4px 10px;
  border: 1px solid rgba(192, 132, 252, 0.4);
  border-radius: 999px;
  background: transparent;
  color: #cbb3f5;
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
}

.agent-banner .ab-cancel:hover {
  border-color: #c084fc;
  color: #fff;
}

@keyframes agentIn {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-12px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

.agent-cursor {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 47;
  width: 0;
  height: 0;
  pointer-events: none;
  opacity: 0;
  transition: transform 0.16s cubic-bezier(0.3, 0.9, 0.3, 1), opacity 0.2s;
}

.agent-cursor.is-on {
  opacity: 1;
}

.agent-cursor .ac-ring {
  position: absolute;
  left: -14px;
  top: -14px;
  width: 28px;
  height: 28px;
  border: 2px solid #c084fc;
  border-radius: 50%;
  box-shadow: 0 0 18px rgba(192, 132, 252, 0.6), inset 0 0 12px rgba(192, 132, 252, 0.35);

            <button class="kbd-btn" type="button" data-sources>man 页 · 史料</button>
          </div>
        </div>
        <div class="unix-hint" data-hint hidden></div>
      </div>`;

      const teletype = root.querySelector(".teletype");
      const hintEl = root.querySelector("[data-hint]");
      const pipelineEl = root.querySelector("[data-pipeline]");
      const outputEl = root.querySelector("[data-output]");
      const trayEl = root.querySelector("[data-tray]");
      const runBtn = root.querySelector("[data-run]");
      const undoBtn = root.querySelector("[data-undo]");
      const resetBtn = root.querySelector("[data-reset]");
      const lineEls = Array.from(root.querySelectorAll(".log-line"));

      const local = { pipeline: ["cat access.log"], errors: 0, locked: false, timer: null, cancelled: false };

      const renderPipeline = () => {
        const parts = local.pipeline.map(
          (command) => `<span class="pipe-cmd">${CTM.utils.escapeHtml(command)}</span>`
        );
        pipelineEl.innerHTML = parts.join('<span class="pipe-sep">|</span>');
      };

      const setBusy = (busy) => {
        runBtn.disabled = busy;
        undoBtn.disabled = busy;
        resetBtn.disabled = busy;
        trayEl.querySelectorAll("button").forEach((button) => {
          button.disabled = busy;
        });
      };

      const clearHighlights = () => lineEls.forEach((el) => el.classList.remove("is-hit"));

      const evaluate = () => {
        let lines = LOG_LINES.slice();
        let count = null;
        for (const command of local.pipeline.slice(1)) {
          if (command === "grep ERROR") lines = lines.filter((line) => line.includes("ERROR"));
          else if (command === "grep 500") lines = lines.filter((line) => line.includes("500"));
          else if (command === "grep 404") lines = lines.filter((line) => line.includes("404"));
          else if (command === "sort") lines = lines.slice().sort();
          else if (command === "uniq -c") {
            const counts = new Map();
            lines.forEach((line) => counts.set(line, (counts.get(line) || 0) + 1));
            lines = Array.from(counts.entries()).map(([line, amount]) => `${amount} ${line}`);
          } else if (command === "wc -l") count = lines.length;
        }
        return { lines, count };
      };

      const highlightSuccess = () => {
        lineEls.forEach((el, index) => {
          if (LOG_LINES[index].includes("500") && LOG_LINES[index].includes("ERROR")) el.classList.add("is-hit");
        });
      };

      const has = (command) => local.pipeline.includes(command);

      const diagnose = (count) => {
        if (count === 7) return "结果是 7 —— 你数的是整份日志。先缩小范围（grep），再数行数（wc -l）。";
        if (count === 4 && has("grep 500") && !has("grep ERROR")) {
          return "多出来的那一行是 GET /api/slow：它的状态码是 200，只是耗时 500ms。grep 按字符匹配，看到「500」就留下。再补一道 grep ERROR，把 OK 的行筛掉。";
        }
        if (count === 4 && has("grep ERROR") && !has("grep 500")) {
          return "多出来的那一行是 GET /missing：它确实写着 ERROR，但状态码是 404。你要的是 500，再补一道 grep 500。";
        }
        if (count === 5) return "5 行里混进了 404 和 500ms。两条筛选都要：ERROR 和 500 同时命中的那几行才是答案。";
        if (count === 0) return "结果是 0：两道 grep 之间互相筛空了。检查你接的关键字，日志里同时出现「500」和「ERROR」的行是有的。";
        return `结果是 ${count}，不是 3。把最后的 wc -l 去掉再运行一次，就能看见到底是哪几行被留下了 —— 这也是真实的调试方法。`;
      };

      const showHint = (cause) => {
        const plan =
          local.errors >= 2
            ? `<div class="hint-plan">一条能跑通的管道：<code>cat access.log | grep ERROR | grep 500 | wc -l</code>。</div>`
            : "";
        hintEl.innerHTML = `<div class="hint-head">为什么不对</div><div class="hint-cause">${CTM.utils.escapeHtml(
          cause
        )}</div>${plan}`;
        hintEl.hidden = false;
      };

      const runPipeline = () => {
        if (local.locked) return;
        if (local.pipeline.length <= 1) {
          api.toast("管道里只有 cat。把工具接到它后面。");
          CTM.audio.error();
          return;
        }
        const { lines, count } = evaluate();
        clearHighlights();
        if (count === null) {
          outputEl.textContent = lines.length ? lines.join("\n") : "(空)";
          showHint("管道有输出，但还没有数行数。最后接一个 wc -l，它会把上面交下来的行数列成一个数字。");
          CTM.audio.teletype();
          return;
        }
        outputEl.textContent = String(count);
        CTM.audio.teletype();
        if (count === 3) {
          local.locked = true;
          hintEl.hidden = true;
          setBusy(true);
          teletype.classList.add("is-printed");
          highlightSuccess();
          const steps = local.pipeline.length - 1;
          const score = {
            systems: Math.max(8, 20 - Math.max(0, steps - 3) * 3 - local.errors * 2),
            expression: 5,
          };
          local.timer = setTimeout(
            () =>
              !local.cancelled &&
              api.complete(score, { pipeline: local.pipeline.slice(), errors: local.errors }, { continueLabel: "前往 1991 →" }),
            900
          );
          return;
        }
        local.errors += 1;
        showHint(diagnose(count));
        if (local.errors === 1) api.cheat("grep 按字符匹配，坑就在这里。可以让 Agent 替你接这条管道。");
      };

      const onTrayClick = (event) => {
        const button = event.target.closest("[data-cmd]");
        if (!button || local.locked) return;
        local.pipeline.push(button.dataset.cmd);
        renderPipeline();
        outputEl.textContent = "> 管道已更新，等待运行。";
        clearHighlights();
        CTM.audio.click();
      };

      const onUndo = () => {
        if (local.locked || local.pipeline.length <= 1) return;
        local.pipeline.pop();
        renderPipeline();
        outputEl.textContent = "> 已撤销最后一个工具。";
        clearHighlights();
        hintEl.hidden = true;
        CTM.audio.glitch();
      };

      const onReset = () => {
        if (local.locked) return;
        local.pipeline = ["cat access.log"];
        local.errors = 0;
        renderPipeline();
        outputEl.textContent = "> 管道已重置。等待运行。";
        clearHighlights();
        hintEl.hidden = true;
        CTM.audio.click();
      };

      trayEl.addEventListener("click", onTrayClick);
      runBtn.addEventListener("click", runPipeline);
      undoBtn.addEventListener("click", onUndo);
      resetBtn.addEventListener("click", onReset);
      renderPipeline();

      return () => {
        local.cancelled = true;
        if (local.timer) clearTimeout(local.timer);
        trayEl.removeEventListener("click", onTrayClick);
        runBtn.removeEventListener("click", runPipeline);
        undoBtn.removeEventListener("click", onUndo);
        resetBtn.removeEventListener("click", onReset);
      };
    },
  });
})(window.CTM = window.CTM || {});

    return cursor;
  }

  function hideCursor() {
    const cursor = document.getElementById("agent-cursor");
    if (cursor) cursor.classList.remove("is-on");
  }

  async function moveTo(el) {
    if (!el) return;
    const cursor = ensureCursor();
    const rect = el.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    cursor.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
    cursor.classList.add("is-on");
    await sleep(150);
  }

  async function tap(el) {
    if (!el || el.disabled) return false;
    await moveTo(el);

    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
    await sleep(120);
    return true;
  }

    if (!el) return;

    el.focus();
    let shown = "";
    const chars = Array.from(value);
    for (let index = 0; index < chars.length; index += 1) {
      if (runner.cancelled) return;
      shown += chars[index];
      el.value = shown;
      el.dispatchEvent(new Event("input", { bubbles: true }));
      if (index % 3 === 0) await sleep(18);
    }
    el.dispatchEvent(new Event("change", { bubbles: true }));
    await sleep(160);
  }

  async function slide(el, value) {
    if (!el) return;
    await moveTo(el);
    el.value = String(value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
    await sleep(140);
  }

    async punch() {
      await tap($("[data-reset]"));
      const code = ($("[data-target-code]") || {}).textContent || "00010";
      const holes = Array.from(document.querySelectorAll(".hole"));
      for (let column = 0; column < 5; column += 1) {
        const bit = code[column] === "1" ? "1" : "0";
        await tap(holes.find((hole) => hole.dataset.col === String(column) && hole.dataset.bit === bit));
      }
      await tap($("[data-read]"));
    },

      await tap($("[data-reset]"));

      await tap($("[data-cloud-run]"));

  }

    takeover,
    assistCurrent,
    cancel() {
      runner.cancelled = true;
      CTM.agent.mode = "idle";
      banner(false);
    },
  };
})(window.CTM = window.CTM || {});

    let raf = null;

    const seed = () => {
      const parent = canvas.parentElement;
      const rect = parent ? parent.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
      width = Math.max(320, rect.width);
      height = Math.max(480, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = width < 700 ? 38 : 70;
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        speed: 0.08 + Math.random() * 0.32,
        size: 9 + Math.random() * 7,
        char: Math.random() < 0.5 ? "0" : "1",
        alpha: 0.06 + Math.random() * 0.16,
        warm: Math.random() < 0.22,
      }));
    };

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      particles.forEach((particle) => {
        particle.y -= particle.speed;
        if (particle.y < -20) {
          particle.y = height + 20;
          particle.x = Math.random() * width;
        }
        ctx.font = `${particle.size}px "SFMono-Regular", Consolas, monospace`;
        ctx.fillStyle = particle.warm
          ? `rgba(224,164,88,${particle.alpha})`
          : `rgba(143,240,255,${particle.alpha})`;
        ctx.fillText(particle.char, particle.x, particle.y);
      });
      if (!utils.prefersReduced()) {
        raf = requestAnimationFrame(draw);
      }
    };

    const onResize = () => {
      seed();
      if (utils.prefersReduced()) draw();
    };

    seed();
    draw();
    window.addEventListener("resize", onResize);
    if (utils.prefersReduced()) {
      if (raf) cancelAnimationFrame(raf);
    }
  }

  function playTunnel(fromYear, toYear, label, duration) {
    return new Promise((resolve) => {
      const overlay = $("#tunnel");
      const canvas = $("#tunnel-canvas");
      const yearEl = $("#tunnel-year");
      const labelEl = $("#tunnel-label");
      const skipBtn = $("#tunnel-skip");
      if (!overlay || !canvas || !yearEl || !labelEl) {
        resolve();
        return;
      }

      const reduced = utils.prefersReduced();
      const total = duration || (reduced ? 260 : 2200);
      let done = false;
      let raf = null;
      let skipHandler = null;
      let keyHandler = null;

      overlay.hidden = false;
      labelEl.textContent = label || "正在校准时间坐标";
      yearEl.textContent = String(fromYear);
      audio.warp();

      const finish = () => {
        if (done) return;
        done = true;
        if (raf) cancelAnimationFrame(raf);
        if (skipHandler) skipBtn.removeEventListener("click", skipHandler);
        if (keyHandler) document.removeEventListener("keydown", keyHandler);
        overlay.hidden = true;
        resolve();
      };

      if (reduced) {
        yearEl.textContent = String(toYear);
        window.setTimeout(finish, total);
        return;
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        finish();
        return;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, width, height);

      const stars = Array.from({ length: 170 }, () => ({
        x: (Math.random() * 2 - 1) * width,
        y: (Math.random() * 2 - 1) * height,
        z: 1 + Math.random() * width,
        color: Math.random() < 0.2 ? "224,164,88" : Math.random() < 0.4 ? "192,132,252" : "143,240,255",
      }));

      skipHandler = finish;
      skipBtn.addEventListener("click", skipHandler);
      keyHandler = (event) => {
        if (event.key === "Escape" || event.key === "Enter" || event.key === " ") finish();
      };
      document.addEventListener("keydown", keyHandler);

      const start = performance.now();
      const frame = (now) => {
        if (done) return;
        const progress = Math.min(1, (now - start) / total);
        const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        yearEl.textContent = String(Math.round(fromYear + (toYear - fromYear) * eased));

        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(0, 0, width, height);

        stars.forEach((star) => {
          star.z -= width * 0.016;
          if (star.z <= 1) {
            star.z = width;
            star.x = (Math.random() * 2 - 1) * width;
            star.y = (Math.random() * 2 - 1) * height;
          }
          const k = 280 / star.z;
          const previous = 280 / (star.z + 16);
          const px = width / 2 + star.x * previous;
          const py = height / 2 + star.y * previous;
          const sx = width / 2 + star.x * k;
          const sy = height / 2 + star.y * k;
          if (sx < -60 || sx > width + 60 || sy < -60 || sy > height + 60) return;
          const alpha = Math.min(1, 1 - star.z / width) * 0.8;
          ctx.strokeStyle = `rgba(${star.color},${alpha})`;
          ctx.lineWidth = Math.max(0.5, (1 - star.z / width) * 2);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(sx, sy);
          ctx.stroke();
        });

        const glow = ctx.createRadialGradient(
          width / 2,
          height / 2,
          0,
          width / 2,
          height / 2,
          Math.min(width, height) * 0.46
        );
        glow.addColorStop(0, "rgba(143,240,255,0.06)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        if (progress < 1) {
          raf = requestAnimationFrame(frame);
        } else {
          finish();
        }
      };
      raf = requestAnimationFrame(frame);
    });
  }

  function mountEra(index) {
    if (!ERAS.length) return;
    if (index >= ERAS.length) {
      showResultFromState();
      return;
    }
    if (currentCleanup) {
      currentCleanup();
      currentCleanup = null;
    }

    eraCompleted = false;
    if (CTM.agent.mode !== "takeover") CTM.agent.mode = "idle";
    state.eraIndex = index;
    state.started = true;
    if (!state.startedAt) state.startedAt = Date.now();
    CTM.storage.save();

    const era = ERAS[index];
    ui.setTheme(era.theme);
    ui.showScreen("era");
    ui.updatePassport();
    removeContinueCard();
    removeCheatCard();

    const root = $("#era-root");
    if (!root) return;
    root.innerHTML = "";

    const api = {
      sound: audio,
      reduced: utils.prefersReduced(),
      toast: ui.toast,
      openSources() {
        openSources(era);
      },
      assist() {
        CTM.agent.assistCurrent(index);
      },
      cheat(reason) {
        showCheatCard(index, reason);
      },
      complete(score, choice, options) {
        completeEra(index, score, choice, options || {});
      },
    };

    try {
      currentCleanup = era.render(root, api) || null;
    } catch (error) {
      console.error(error);
      root.innerHTML = '<p class="hint-text">这一站加载失败。请刷新页面重试。</p>';
    }

    $$("[data-sources]", root).forEach((button) => {
      button.addEventListener("click", () => openSources(era));
    });

    window.scrollTo({ top: 0, behavior: utils.prefersReduced() ? "auto" : "smooth" });
  }

  function removeContinueCard() {
    const existing = $("#era-continue");
    if (existing) existing.remove();
  }

  function removeCheatCard() {
    const existing = $("#cheat-card");
    if (existing) existing.remove();
    document.body.classList.remove("has-cheat");
  }

  /* 第一次答错后给一个诚实的作弊口：可以自动填，但档案会记下来 */
  function showCheatCard(index, reason) {
    if (state.stamps.includes(index) || cheatRefused === index) return;
    removeCheatCard();
    const era = ERAS[index];
    const card = document.createElement("div");
    card.className = "cheat-card";
    card.id = "cheat-card";
    card.innerHTML = `<div class="cc-kicker">CHEAT CODE · ${era.year}</div>
      <div class="cc-body">
        <div class="cc-text">${escapeHtml(
          reason || "卡住了？可以让 Agent 帮你把这一关填完。"
        )}<span class="cc-note">档案会写明这一站是代打的</span></div>
        <div class="cc-actions">
          <button class="cc-go" type="button" data-cheat-go>自动帮我填</button>
          <button class="cc-no" type="button" data-cheat-no>我再想想</button>
        </div>
      </div>`;
    document.body.appendChild(card);
    document.body.classList.add("has-cheat");

    card.querySelector("[data-cheat-no]").addEventListener("click", () => {
      cheatRefused = index;
      removeCheatCard();
      audio.click();
    });
    card.querySelector("[data-cheat-go]").addEventListener("click", async () => {
      removeCheatCard();
      cheatRefused = index;
      CTM.agent.mode = "assist";
      await CTM.agent.assistCurrent(index);
    });
    audio.error();
  }

  function showContinueCard(index, label) {
    removeContinueCard();
    const era = ERAS[index];
    const isLast = index >= ERAS.length - 1;
    const card = document.createElement("div");
    card.className = "era-continue";
    card.id = "era-continue";
    card.innerHTML = `<div class="ec-stamp">${CTM.icons[era.icon] || ""}<span>${era.year}</span></div>
      <div class="ec-text">
        <b>${escapeHtml(era.label)}</b>
        <span>STAMP ${index + 1} / ${ERAS.length}</span>
      </div>
      <button class="ec-btn" type="button">${escapeHtml(label)}</button>`;
    document.body.appendChild(card);

    const button = card.querySelector(".ec-btn");
    let busy = false;
    button.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      button.disabled = true;
      card.classList.add("is-leaving");
      audio.click();
      const nextIndex = index + 1;
      const nextEra = ERAS[nextIndex];
      removeContinueCard();
      if (isLast) {
        await finishJourney();
      } else {
        await playTunnel(era.year, nextEra.year, `正在前往 ${nextEra.year} · ${nextEra.label}`);
        mountEra(nextIndex);
      }
    });
    window.setTimeout(() => button.focus({ preventScroll: true }), 60);
  }

  async function finishJourney() {
    stopTimer();
    state.eraIndex = ERAS.length;
    state.completed = true;
    if (!state.finishedAt) state.finishedAt = Date.now();
    CTM.storage.save();
    const prompt = state.ai && state.ai.prompt ? state.ai.prompt : "";
    await CTM.finale.play(prompt);
    showResultFromState();
  }

  function completeEra(index, score, choice, options) {
    if (eraCompleted) return;
    const takenOver = CTM.agent.mode !== "idle";
    const finalScore = takenOver
      ? Object.assign({}, score, { direction: (Number(score && score.direction) || 0) + 3 })
      : score;
    if (!ui.recordEra(index, finalScore, choice, takenOver)) return;
    eraCompleted = true;
    if (CTM.agent.mode === "assist") CTM.agent.mode = "idle";

    const era = ERAS[index];
    const nextIndex = index + 1;
    const completed = nextIndex >= ERAS.length;
    state.eraIndex = Math.min(nextIndex, ERAS.length);
    state.completed = completed;
    if (completed) state.finishedAt = Date.now();
    CTM.storage.save();
    ui.updatePassport();

    const stamp = $(`#passport-track .p-stamp:nth-child(${index + 1})`);
    if (stamp) {
      stamp.classList.add("is-fresh");
      window.setTimeout(() => stamp.classList.remove("is-fresh"), 1200);
    }

    const room = $("#era-root .room");
    if (room) room.classList.add("is-done");
    audio.stamp();

    const label =
      options.continueLabel ||
      (completed ? "查看我的时间旅行档案" : `前往 ${ERAS[nextIndex].year} →`);
    showContinueCard(index, label);
  }

  function showResultFromState() {
    stopTimer();
    if (currentCleanup) {
      currentCleanup();
      currentCleanup = null;
    }
    ui.closeModal();
    removeContinueCard();
    eraCompleted = true;
    state.eraIndex = ERAS.length;
    state.completed = true;
    if (!state.finishedAt) state.finishedAt = Date.now();
    CTM.storage.save();
    const data = CTM.result.compute();
    ui.setTheme("result");
    ui.showScreen("result");
    CTM.result.show(data);
    audio.chime();
  }

  function showResultFromData(data) {
    if (!data) {
      goHome();
      ui.toast("分享链接无效。");
      return;
    }
    if (currentCleanup) {
      currentCleanup();
      currentCleanup = null;
    }
    ui.closeModal();
    removeContinueCard();
    ui.setTheme("result");
    ui.showScreen("result");
    CTM.result.show(data);
    audio.chime();
  }

  function stopFutureParticles() {
    futureActive = false;
    if (futureRaf) cancelAnimationFrame(futureRaf);
    futureRaf = null;
  }

  function goHome() {
    ui.closeModal();
    removeContinueCard();
    stopTimer();
    stopFutureParticles();
    if (currentCleanup) {
      currentCleanup();
      currentCleanup = null;
    }
    if (window.location.hash.startsWith("#r=")) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    ui.setTheme("landing");
    ui.showScreen("landing");
    updateContinueUI();
    const status = $("#console-status");
    if (status) status.textContent = "READY";
  }

  function resetAndHome() {
    ui.closeModal();
    removeContinueCard();
    stopTimer();
    CTM.agent.mode = "idle";
    CTM.agent.cancel();
    stopFutureParticles();
    if (currentCleanup) {
      currentCleanup();
      currentCleanup = null;
    }
    CTM.storage.clear();
    ui.resetState();
    audio.updateButtons();
    const eraRoot = $("#era-root");
    if (eraRoot) eraRoot.innerHTML = "";
    const resultRoot = $("#result-root");
    if (resultRoot) resultRoot.innerHTML = "";
    const traveler = $("#traveler");
    if (traveler) traveler.value = "";
    const wrap = $("#continue-wrap");
    if (wrap) wrap.hidden = true;
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    ui.setTheme("landing");
    ui.showScreen("landing");
    const status = $("#console-status");
    if (status) status.textContent = "READY";
    ui.toast("已重置。可以开始新的时间旅行。");
  }

  function openSources(era) {
    const sources = Array.isArray(era.sources) ? era.sources : [];
    ui.modal(
      `<button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
      <div class="modal-kicker">SOURCE NOTES / ${era.year}</div>
      <h2 class="modal-title" id="modal-title">${escapeHtml(era.label)} · 史料小注</h2>
      <div class="help-content">
        <ul class="help-list">${sources.map((source) => `<li>${escapeHtml(source)}</li>`).join("")}</ul>
        <p>史料用于交代时代背景，交互为示意性玩法。发布帖会附上参考来源。</p>
      </div>`,
      { dismissible: true }
    );
  }

  async function beginJourney(name) {
    if (starting) return;
    starting = true;
    const startButton = $("#start-btn");
    if (startButton) startButton.disabled = true;
    ui.resetState();
    cheatRefused = null;
    state.traveler = name;
    state.started = true;
    state.startedAt = Date.now();
    state.eraIndex = 0;
    state.completed = false;
    state.deadlineAt = Date.now() + CTM.TIME_LIMIT_MS;
    CTM.storage.save();
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    ui.updatePassport();
    const status = $("#console-status");
    if (status) status.textContent = "ONLINE";
    audio.click();
    await playTunnel(2026, ERAS[0].year, "正在校准时间坐标 · 1804", 2400);
    mountEra(0);
    startTimer();
    starting = false;
    if (startButton) startButton.disabled = false;
  }

  function onStartSubmit(event) {
    event.preventDefault();
    if (starting) return;
    const input = $("#traveler");
    const name = (input && input.value.trim()) || CTM.DEFAULT_TRAVELER;
    if (state.started && state.stamps.length > 0) {
      ui.modal(
        `<button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
        <div class="modal-kicker">NEW JOURNEY</div>
        <h2 class="modal-title" id="modal-title">开始新的时间旅行？</h2>
        <div class="modal-success">当前进度是 ${state.stamps.length}/6 枚印章，开始新旅行会覆盖它。你也可以取消，然后使用“继续上次旅行”。</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-modal-close>取消</button>
          <button class="btn btn-primary" type="button" data-confirm>开始新旅行</button>
        </div>`,
        {
          dismissible: true,
          onMount(card, close) {
            const confirm = card.querySelector("[data-confirm]");
            if (confirm) {
              confirm.addEventListener("click", () => {
                close();
                beginJourney(name);
              });
            }
          },
        }
      );
      return;
    }
    beginJourney(name);
  }

  async function continueJourney() {
    if (starting) return;
    if (state.completed || state.eraIndex >= ERAS.length) {
      showResultFromState();
      return;
    }
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    starting = true;
    const button = $("#continue-btn");
    if (button) button.disabled = true;
    audio.click();
    const era = ERAS[Math.max(0, Math.min(state.eraIndex, ERAS.length - 1))];
    await playTunnel(2026, era.year, `正在回到第 ${state.eraIndex + 1} 站 · ${era.label}`, 1600);
    mountEra(state.eraIndex);
    starting = false;
    if (button) button.disabled = false;
    startTimer();
    if (remainingMs() === 0) triggerTakeover();
  }

  function leaveFuture() {
    stopFutureParticles();
    const screen = futureReturn.screen === "future" ? "landing" : futureReturn.screen;
    ui.setTheme(futureReturn.theme || "landing");
    ui.showScreen(screen);
    updateContinueUI();
  }

  function startFutureParticles() {
    stopFutureParticles();
    const canvas = $("#future-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const width = window.innerWidth;
    const height = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    const glow = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.min(width, height) * 0.5);
    glow.addColorStop(0, "rgba(143,240,255,0.08)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    const off = document.createElement("canvas");
    off.width = width;
    off.height = height;
    const octx = off.getContext("2d");
    if (!octx) return;
    octx.fillStyle = "#fff";
    octx.font = `900 ${Math.min(width * 0.48, height * 0.56)}px "Arial Black", "PingFang SC", sans-serif`;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText("1024", width / 2, height / 2);
    const image = octx.getImageData(0, 0, width, height).data;
    const points = [];
    const step = Math.max(4, Math.round(width / 280));
    for (let y = 0; y < height; y += step) {
      for (let x = 0; x < width; x += step) {
        if (image[(y * width + x) * 4 + 3] > 128) points.push({ x, y });
      }
    }
    for (let index = points.length - 1; index > 0; index -= 1) {
      const swap = Math.floor(Math.random() * (index + 1));
      const temp = points[index];
      points[index] = points[swap];
      points[swap] = temp;
    }

    const particles = Array.from({ length: 1024 }, (_, index) => {
      const point = points.length ? points[index % points.length] : { x: width / 2, y: height / 2 };
      const jitter = points.length && index >= points.length ? 2 : 0;
      return {
        sx: Math.random() * width,
        sy: Math.random() * height,
        tx: point.x + (Math.random() * 2 - 1) * jitter,
        ty: point.y + (Math.random() * 2 - 1) * jitter,
        color: index % 5 === 0 ? "192,132,252" : index % 3 === 0 ? "224,164,88" : "143,240,255",
        size: 0.9 + Math.random() * 1.3,
      };
    });

    const drawParticles = (progress) => {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, width, height);
      const halo = ctx.createRadialGradient(
        width / 2,
        height / 2,
        0,
        width / 2,
        height / 2,
        Math.min(width, height) * 0.52
      );
      halo.addColorStop(0, "rgba(143,240,255,0.07)");
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalAlpha = 0.035 + progress * 0.025;
      ctx.fillStyle = "#8ff0ff";
      ctx.font = `900 ${Math.min(width * 0.48, height * 0.56)}px "Arial Black", "PingFang SC", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("1024", width / 2, height / 2);
      ctx.restore();

      particles.forEach((particle) => {
        const x = particle.sx + (particle.tx - particle.sx) * progress;
        const y = particle.sy + (particle.ty - particle.sy) * progress;
        ctx.fillStyle = `rgba(${particle.color},${0.35 + progress * 0.45})`;
        ctx.fillRect(x, y, particle.size, particle.size);
      });
    };

    if (utils.prefersReduced()) {
      drawParticles(1);
      return;
    }

    futureActive = true;
    const start = performance.now();
    const duration = 2500;
    const frame = (now) => {
      if (!futureActive) return;
      const raw = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - raw, 3);
      drawParticles(eased);
      if (raw < 1) {
        futureRaf = requestAnimationFrame(frame);
      } else {
        futureActive = false;
        futureRaf = null;
      }
    };
    futureRaf = requestAnimationFrame(frame);
  }

  function showFuture() {
    if (!$("#modal-root").hidden) return;
    if (!$("#tunnel").hidden) return;
    const active = document.querySelector(".screen.is-active");
    const screen = active ? active.id.replace("screen-", "") : "landing";
    if (screen !== "future") {
      futureReturn = { screen, theme: document.body.dataset.era || "landing" };
    }
    ui.closeModal();
    ui.setTheme("future");
    ui.showScreen("future");
    startFutureParticles();
    audio.chime();
  }

  function bindEvents() {
    const brand = $("#brand");
    if (brand) brand.addEventListener("click", goHome);
    const help = $("#help-open");
    if (help) help.addEventListener("click", openHelp);
    ["sound-toggle", "sound-toggle-2"].forEach((id) => {
      const button = document.getElementById(id);
      if (button) {
        button.addEventListener("click", () => {
          audio.toggle();
        });
      }
    });

    const form = $("#start-form");
    if (form) form.addEventListener("submit", onStartSubmit);
    const continueButton = $("#continue-btn");
    if (continueButton) continueButton.addEventListener("click", continueJourney);
    const restart = $("#restart-btn");
    if (restart) restart.addEventListener("click", resetAndHome);
    const futureBack = $("#future-back");
    if (futureBack) futureBack.addEventListener("click", leaveFuture);
    const agentCancel = $("#agent-cancel");
    if (agentCancel) {
      agentCancel.addEventListener("click", () => {
        CTM.agent.cancel();
        takingOver = false;
        removeContinueCard();
        mountEra(Math.min(state.eraIndex, ERAS.length - 1));
        startTimer();
        ui.toast("时间还给你。剩下的自己来。");
      });
    }

    document.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const target = event.target;
      if (target && target.closest && target.closest("input, textarea, select, [contenteditable='true']")) return;
      if (!/^[0-9]$/.test(event.key)) {
        keyBuffer = "";
        return;
      }
      keyBuffer = (keyBuffer + event.key).slice(-4);
      if (keyBuffer === "1024") {
        keyBuffer = "";
        showFuture();
      }
    });
  }

  function init() {
    bindEvents();
    restoreSaved();
    typeBootLog();
    initLandingCanvas();
    audio.updateButtons();
    ui.showScreen("landing");

    if (window.location.hash.startsWith("#r=")) {
      const data = CTM.result.decode(window.location.hash.slice(3));
      if (data) {
        showResultFromData(data);
      } else {
        ui.toast("分享链接无效或已损坏。");
      }
      return;
    }

    updateContinueUI();
  }

  CTM.goHome = goHome;
  CTM.resetAndHome = resetAndHome;
  CTM.mountEra = mountEra;
  CTM.showFuture = showFuture;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(window.CTM = window.CTM || {});

  </script>
</body>
</html>
