<html lang="zh-CN">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070b10'/%3E%3Ctext x='32' y='41' font-size='20' font-family='monospace' fill='%238ff0ff' text-anchor='middle'%3E1024%3C/text%3E%3C/svg%3E">
  <title>代码时间机器 · 1024 Builder 作品秀</title>
  <style>
/* =========================================================
   代码时间机器 · global design system
   ========================================================= */
:root {
  --topbar-h: 64px;
  --passport-h: 78px;
  --era-bg: #07090c;
  --era-bg-2: #10131a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #eef2f8;
  --era-muted: #8b94a7;
  --era-line: rgba(143, 240, 255, 0.22);
  --era-panel: rgba(255, 255, 255, 0.035);
  --era-warn: #ff8b8b;
  --era-ok: #8ff0a8;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", "Courier New", monospace;
}

body[data-era="landing"] {
  --era-bg: #07090c;
  --era-bg-2: #10131a;
  --era-accent: #8ff0ff;
  --era-accent-2: #e0a458;
  --era-text: #eef2f8;
  --era-muted: #8b94a7;
  --era-line: rgba(143, 240, 255, 0.2);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="punch"] {
  --era-bg: #160f09;
  --era-bg-2: #2b1c10;
  --era-accent: #e0a458;
  --era-accent-2: #f2d0a4;
  --era-text: #f6e8d3;
  --era-muted: #b59a7a;
  --era-line: rgba(224, 164, 88, 0.32);
  --era-panel: rgba(42, 28, 16, 0.64);
}

body[data-era="register"] {
  --era-bg: #03110a;
  --era-bg-2: #061f12;
  --era-accent: #6cff9e;
  --era-accent-2: #b7ffd0;
  --era-text: #d8ffe4;
  --era-muted: #6f9f80;
  --era-line: rgba(108, 255, 158, 0.28);
  --era-panel: rgba(4, 24, 14, 0.68);
}

body[data-era="unix"] {
  --era-bg: #0b0b08;
  --era-bg-2: #1a1a10;
  --era-accent: #f0c674;
  --era-accent-2: #fff0c2;
  --era-text: #f4f0e0;
  --era-muted: #a69b78;
  --era-line: rgba(240, 198, 116, 0.28);
  --era-panel: rgba(26, 26, 16, 0.62);
}

body[data-era="web"] {
  --era-bg: #0a0c2a;
  --era-bg-2: #131a4a;
  --era-accent: #00e5ff;
  --era-accent-2: #ff4fd8;
  --era-text: #eef2ff;
  --era-muted: #9aa6d8;
  --era-line: rgba(0, 229, 255, 0.28);
  --era-panel: rgba(19, 26, 74, 0.6);
}

body[data-era="cloud"] {
  --era-bg: #06121f;
  --era-bg-2: #0b2036;
  --era-accent: #6fc3ff;
  --era-accent-2: #b18cff;
  --era-text: #eaf6ff;
  --era-muted: #8aa6c2;
  --era-line: rgba(111, 195, 255, 0.28);
  --era-panel: rgba(11, 32, 54, 0.62);
}

body[data-era="ai"] {
  --era-bg: #05060a;
  --era-bg-2: #0d0a1a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #f2f5ff;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.24);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="result"] {
  --era-bg: #05060a;
  --era-bg-2: #0d0a1a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #f2f5ff;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.22);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="future"] {
  --era-bg: #000;
  --era-bg-2: #000;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #eef2f8;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.2);
  --era-panel: rgba(255, 255, 255, 0.03);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--era-bg);
  color: var(--era-text);
  font-family: var(--font-sans);
  line-height: 1.5;
  overflow-x: hidden;
  transition: background-color 0.6s ease, color 0.6s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 16% -8%, rgba(143, 240, 255, 0.08), transparent 38%),
    radial-gradient(ellipse at 88% 8%, rgba(192, 132, 252, 0.07), transparent 42%),
    radial-gradient(ellipse at 50% 108%, rgba(224, 164, 88, 0.05), transparent 46%);
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

[hidden] {
  display: none !important;
}

::selection {
  background: var(--era-accent);
  color: #071016;
}

:focus-visible {
  outline: 2px solid var(--era-accent);
  outline-offset: 2px;
}

/* =========================================================
   top bar
   ========================================================= */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 60;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 clamp(14px, 3vw, 32px);
  background: rgba(7, 9, 12, 0.76);
  border-bottom: 1px solid var(--era-line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--era-text);
  cursor: pointer;
  text-align: left;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border: 1px solid var(--era-accent);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: 0.02em;
  color: var(--era-accent);
  box-shadow: inset 0 0 18px rgba(143, 240, 255, 0.08);
  position: relative;
}

.brand-mark::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--era-accent);
  right: 4px;
  top: 4px;
  opacity: 0.7;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-text strong {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  font-weight: 600;
}

.brand-text small {
  font-size: 10px;
  color: var(--era-muted);
  letter-spacing: 0.08em;
}

.top-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  margin-right: 4px;
}

.tp-count {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--era-muted);
  white-space: nowrap;
}

.tp-bar {
  width: 112px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.tp-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--era-accent), var(--era-accent-2));
  transition: width 0.5s ease;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 10px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--era-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 11px;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.icon-btn:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
  background: rgba(255, 255, 255, 0.06);
}

.sound-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--era-muted);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
  transition: background 0.2s, box-shadow 0.2s;
}

.sound-btn[aria-pressed="true"] .sound-dot {
  background: var(--era-accent);
  box-shadow: 0 0 10px var(--era-accent);
}

.help-btn {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
}

/* =========================================================
   layout / screens
   ========================================================= */
#app {
  position: relative;
  z-index: 1;
}

#main {
  position: relative;
  padding-top: var(--topbar-h);
  padding-bottom: calc(var(--passport-h) + 24px);
}

body.is-landing #main,
body.is-result #main,
body.is-future #main {
  padding-bottom: 0;
}

body.is-future #topbar,
body.is-future #passport {
  display: none;
}

body.is-future #main {
  padding-top: 0;
}

.screen {
  display: none;
  min-height: calc(100vh - var(--topbar-h) - var(--passport-h) - 24px);
}

.screen.is-active {
  display: block;
  animation: screenIn 0.4s ease both;
}

#screen-future.is-active {
  display: grid;
}

/* =========================================================
   typography & common controls
   ========================================================= */
.btn {
  height: 44px;
  padding: 0 18px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--era-text);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
  border-color: var(--era-accent);
  background: rgba(255, 255, 255, 0.07);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.38;
  pointer-events: none;
}

.btn-primary {
  background: var(--era-accent);
  border-color: var(--era-accent);
  color: #071016;
  box-shadow: 0 10px 34px rgba(143, 240, 255, 0.16);
}

.btn-primary:hover {
  background: var(--era-accent);
  filter: brightness(1.08);
}

.btn-ghost {
  background: transparent;
}

.btn-quiet {
  height: 36px;
  padding: 0 10px;
  border-color: transparent;
  background: transparent;
  color: var(--era-muted);
  font-weight: 500;
}

.btn-quiet:hover {
  color: var(--era-text);
  background: rgba(255, 255, 255, 0.05);
}

.linkish {
  padding: 0;
  border: 0;
  background: none;
  color: var(--era-accent-2);
  font-size: inherit;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

input,
textarea,
select {
  color: var(--era-text);
  background: rgba(0, 0, 0, 0.24);
  border: 1px solid var(--era-line);
  border-radius: 8px;
  padding: 0.72em 0.9em;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder,
textarea::placeholder {
  color: var(--era-muted);
  opacity: 0.75;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--era-accent);
  box-shadow: 0 0 0 3px rgba(143, 240, 255, 0.08);
}

code,
kbd {
  font-family: var(--font-mono);
}

/* =========================================================
   landing
   ========================================================= */
#screen-landing {
  position: relative;
  overflow: hidden;
  min-height: calc(100vh - var(--topbar-h));
}

#landing-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.52;
  pointer-events: none;
}

.landing-inner {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: clamp(36px, 7vh, 88px) 22px 70px;
  text-align: center;
}

.hero-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--era-accent);
  text-transform: uppercase;
}

.hero-title {
  margin: 14px 0 18px;
  font-size: clamp(42px, 10.5vw, 132px);
  line-height: 0.86;
  letter-spacing: -0.06em;
  font-weight: 800;
  color: var(--era-text);
  text-wrap: balance;
}

.hero-title span {
  color: var(--era-accent-2);
  position: relative;
  display: inline-block;
}

.hero-title span::after {
  content: "";
  position: absolute;
  left: 3%;
  right: 3%;
  bottom: 0.08em;
  height: 0.055em;
  background: var(--era-accent);
  opacity: 0.65;
  transform: skewX(-18deg);
}

.hero-sub {
  margin: 0 auto;
  max-width: 580px;
  color: var(--era-muted);
  font-size: clamp(14px, 1.8vw, 18px);
  line-height: 1.7;
}

.console {
  max-width: 640px;
  margin: 34px auto 0;
  text-align: left;
  border: 1px solid var(--era-line);
  border-radius: 14px;
  background: rgba(8, 10, 14, 0.82);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.025);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow: hidden;
}

.console-bar {
  height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 13px;
  border-bottom: 1px solid var(--era-line);
  background: rgba(255, 255, 255, 0.025);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--era-muted);
}

.console-dots {
  display: flex;
  gap: 4px;
}

.console-dots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #5a5f6a;
}

.console-dots i:nth-child(1) {
  background: #ff6b6b;
}

.console-dots i:nth-child(2) {
  background: #ffd166;
}

.console-dots i:nth-child(3) {
  background: #6cff9e;
}

.console-title {
  letter-spacing: 0.06em;
}

.console-status {
  margin-left: auto;
  color: var(--era-ok);
  font-size: 9px;
  letter-spacing: 0.18em;
}

.boot-log {
  min-height: 116px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--era-line);
  background:
    radial-gradient(circle at 20% 0%, rgba(108, 255, 158, 0.06), transparent 55%),
    rgba(0, 0, 0, 0.18);
  color: #9fe8b0;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.85;
  white-space: pre-wrap;
  text-shadow: 0 0 14px rgba(108, 255, 158, 0.18);
}

.boot-line {
  display: block;
}

.boot-cursor {
  display: inline-block;
  width: 7px;
  height: 12px;
  margin-left: 2px;
  vertical-align: -1px;
  background: #9fe8b0;
  animation: blink 1.1s steps(1, end) infinite;
}

.start-form {
  display: grid;
  gap: 9px;
  padding: 16px 18px 18px;
}

.start-form > label {
  font-size: 11px;
  color: var(--era-muted);
}

.start-form > label span {
  opacity: 0.65;
  margin-left: 4px;
}

.start-row {
  display: flex;
  gap: 8px;
}

.start-row input {
  flex: 1;
  min-width: 0;
  height: 44px;
  font-size: 14px;
}

.start-row .btn {
  flex: 0 0 auto;
}

.continue-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 18px 16px;
}

.continue-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--era-muted);
}

.console-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 18px;
  border-top: 1px solid var(--era-line);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--era-muted);
}

.era-teaser {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  margin-top: 26px;
}

.teaser-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.03em;
}

.teaser-chip b {
  color: var(--era-accent);
  font-weight: 700;
}

.landing-hint {
  margin: 18px 0 0;
  font-size: 11px;
  color: var(--era-muted);
  opacity: 0.75;
}

kbd {
  display: inline-block;
  padding: 2px 5px;
  border: 1px solid var(--era-line);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 10px;
}

/* =========================================================
   passport
   ========================================================= */
.passport {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 55;
  height: var(--passport-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 clamp(14px, 3vw, 32px);
  background: rgba(7, 9, 12, 0.84);
  border-top: 1px solid var(--era-line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.passport-label {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 70px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--era-muted);
}

.passport-label strong {
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--era-text);
  font-weight: 600;
}

.passport-track {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  max-width: 1180px;
  margin: 0 auto;
}

.p-stamp {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  opacity: 0.4;
  transition: opacity 0.3s, border-color 0.3s, background 0.3s, color 0.3s;
}

.p-icon {
  width: 26px;
  height: 26px;
  border: 1px solid var(--era-line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--era-muted);
}

.p-icon svg {
  width: 14px;
  height: 14px;
}

.p-meta {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 0;
}

.p-year {
  font-family: var(--font-mono);
  font-size: 8px;
  line-height: 1.3;
  color: var(--era-muted);
}

.p-label {
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.p-stamp.is-done {
  opacity: 1;
  border-color: var(--era-line);
  background: rgba(255, 255, 255, 0.025);
  color: var(--era-accent-2);
}

.p-stamp.is-done .p-icon {
  color: var(--era-accent);
  border-color: var(--era-accent);
  background: rgba(143, 240, 255, 0.06);
}

.p-stamp.is-current {
  opacity: 1;
  border-color: var(--era-accent);
  box-shadow: inset 0 0 0 1px var(--era-accent), 0 0 22px rgba(143, 240, 255, 0.08);
  animation: stampPulse 2.4s ease-in-out infinite;
}

/* =========================================================
   tunnel
   ========================================================= */
.tunnel {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: #000;
  display: grid;
  place-items: center;
  overflow: hidden;
}

#tunnel-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.tunnel-hud {
  position: relative;
  z-index: 1;
  text-align: center;
  pointer-events: none;
  animation: tunnelIn 0.5s ease both;
}

.tunnel-year {
  font-family: var(--font-mono);
  font-size: clamp(64px, 15vw, 180px);
  font-weight: 800;
  line-height: 0.9;
  letter-spacing: -0.07em;
  color: #fff;
  text-shadow: 0 0 40px rgba(143, 240, 255, 0.45), 0 0 120px rgba(192, 132, 252, 0.25);
}

.tunnel-label {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  color: #8ff0ff;
  text-transform: uppercase;
}

#tunnel-skip {
  pointer-events: auto;
  margin-top: 26px;
  color: #9aa;
}

/* =========================================================
   modal & toast
   ========================================================= */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.modal-card {
  position: relative;
  width: min(560px, 100%);
  max-height: 90vh;
  overflow: auto;
  padding: 30px 28px;
  border: 1px solid var(--era-line);
  border-radius: 18px;
  background: #0b0e13;
  color: var(--era-text);
  box-shadow: 0 40px 120px rgba(0, 0, 0, 0.65);
  animation: popIn 0.25s ease both;
}

.modal-kicker {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  color: var(--era-muted);
  text-transform: uppercase;
}

.modal-title {
  margin: 8px 0 12px;
  font-size: clamp(24px, 4vw, 34px);
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.modal-success {
  margin: 10px 0 22px;
  color: var(--era-muted);
  font-size: 14px;
  line-height: 1.8;
}

.modal-success b {
  color: var(--era-accent-2);
}

.modal-success code {
  color: var(--era-accent);
  background: rgba(143, 240, 255, 0.07);
  border: 1px solid var(--era-line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.92em;
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.stamp-big {
  position: relative;
  width: 108px;
  height: 108px;
  margin: 0 auto 20px;
  border: 2px solid var(--era-accent);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  transform: rotate(-7deg);
  box-shadow: inset 0 0 40px rgba(143, 240, 255, 0.1), 0 0 50px rgba(143, 240, 255, 0.08);
}

.stamp-big::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed currentColor;
  border-radius: 50%;
  opacity: 0.45;
}

.stamp-big svg {
  width: 32px;
  height: 32px;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--era-line);
  border-radius: 50%;
  background: transparent;
  color: var(--era-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
}

.help-content {
  display: grid;
  gap: 12px;
  color: var(--era-muted);
  font-size: 13px;
  line-height: 1.75;
}

.help-content h3 {
  margin: 8px 0 0;
  color: var(--era-text);
  font-size: 13px;
}

.help-list {
  margin: 0;
  padding-left: 18px;
}

.help-list li {
  margin: 4px 0;
}

.help-content kbd {
  color: var(--era-accent-2);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--passport-h) + 18px);
  z-index: 120;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 15px;
  border: 1px solid var(--era-line);
  border-radius: 9px;
  background: #0c1017;
  color: var(--era-text);
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
  transform: translate(-50%, 10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   era layout
   ========================================================= */
.era-shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(20px, 4vw, 42px) clamp(14px, 3vw, 24px) 50px;
}

.era-head {
  margin-bottom: 22px;
}

.era-kicker {
  margin-bottom: 9px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  color: var(--era-accent);
  text-transform: uppercase;
}

.era-head-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}

.era-title {
  margin: 0;
  font-size: clamp(38px, 6vw, 68px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  font-weight: 800;
}

.era-intro {
  max-width: 720px;
  margin: 12px 0 0;
  color: var(--era-muted);
  font-size: clamp(13px, 1.6vw, 16px);
  line-height: 1.75;
}

.era-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(320px, 0.88fr);
  gap: clamp(16px, 2.4vw, 26px);
  align-items: start;
}

.scene {
  position: relative;
  min-height: 480px;
  padding: clamp(16px, 2.5vw, 30px);
  border: 1px solid var(--era-line);
  border-radius: 20px;
  background: var(--era-panel);
  box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.35), 0 24px 80px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.scene > * {
  width: 100%;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.task-card {
  padding: 18px;
  border: 1px solid var(--era-line);
  border-radius: 16px;
  background: var(--era-panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.task-label {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.24em;
  color: var(--era-accent);
  text-transform: uppercase;
}

.task-title {
  margin: 8px 0 7px;
  font-size: clamp(20px, 2.6vw, 26px);
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.task-desc {
  margin: 0;
  color: var(--era-muted);
  font-size: 12px;
  line-height: 1.7;
}

.feedback {
  min-height: 18px;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.6;
  color: var(--era-accent-2);
}

.feedback.is-error {
  color: var(--era-warn);
}

.feedback.is-ok {
  color: var(--era-ok);
}

.panel-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.control-label {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--era-muted);
  text-transform: uppercase;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.hint-text {
  padding-left: 10px;
  border-left: 2px solid var(--era-accent);
  color: var(--era-muted);
  font-size: 11px;
  line-height: 1.7;
}

/* =========================================================
   era 1 · punch card
   ========================================================= */
.punch-scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.loom {
  position: relative;
  width: 100%;
  height: 104px;
  border: 1px solid rgba(224, 164, 88, 0.18);
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(224, 164, 88, 0.1), rgba(0, 0, 0, 0.12)),
    repeating-linear-gradient(0deg, transparent 0 20px, rgba(224, 164, 88, 0.05) 20px 21px);
  overflow: hidden;
}

.loom-beam {
  position: absolute;
  left: 8px;
  right: 8px;
  top: 9px;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(#a86b31, #3a2110);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.loom-beam.bottom {
  top: auto;
  bottom: 9px;
}

.threads {
  position: absolute;
  inset: 20px 12px;
  background: repeating-linear-gradient(90deg, transparent 0 11px, rgba(242, 226, 196, 0.26) 11px 12px);
  -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
}

.shuttle {
  position: absolute;
  top: 43%;
  left: 6%;
  width: 48px;
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(90deg, #e0a458, #fff0c2);
  box-shadow: 0 0 18px rgba(224, 164, 88, 0.4);
}

.loom.is-running .shuttle {
  animation: weave 1.15s ease-in-out infinite;
}

.punch-card {
  position: relative;
  width: min(100%, 540px);
  aspect-ratio: 1.58;
  padding: clamp(14px, 2.5vw, 22px);
  border-radius: 5px;
  background-color: #efe0c1;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 17px, rgba(43, 33, 24, 0.045) 17px 18px),
    radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.38), transparent 42%);
  color: #2b2118;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(43, 33, 24, 0.14);
  transform: rotate(-1.2deg);
  overflow: hidden;
}

.punch-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 5px;
  margin-bottom: 7px;
  border-bottom: 2px solid #b3402f;
}

.punch-card-title {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  color: #7a4b2a;
}

.punch-letter {
  font-family: var(--font-mono);
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  line-height: 1;
  color: #b3402f;
}

.binary-readout {
  margin: 2px 0 9px;
  font-family: var(--font-mono);
  font-size: clamp(13px, 2vw, 17px);
  letter-spacing: 0.34em;
  text-align: center;
  color: #2b2118;
}

.binary-readout small {
  display: block;
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: #7a4b2a;
}

.hole-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(6px, 1.2vw, 12px);
}

.hole-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hole {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  border: 2px solid #b89a6a;
  border-radius: 50%;
  background: #d8c3a0;
  box-shadow: inset 0 2px 4px rgba(43, 33, 24, 0.18);
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
}

.hole:hover {
  transform: scale(1.04);
  border-color: #b3402f;
}

.hole small {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  color: #6a4a2a;
}

.hole.is-punched {
  background: #1a120b;
  border-color: #1a120b;
  box-shadow: inset 0 3px 7px #000, 0 0 0 2px rgba(179, 64, 47, 0.12);
}

.hole.is-punched small {
  color: #efe0c1;
}

.hole.is-target {
  animation: targetPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 0 3px rgba(179, 64, 47, 0.42);
}

.woven-stamp {
  position: absolute;
  right: 12px;
  bottom: 10px;
  padding: 3px 7px;
  border: 2px solid #b3402f;
  color: #b3402f;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  transform: rotate(-12deg);
  opacity: 0;
  transition: opacity 0.3s;
}

.punch-card.is-woven .woven-stamp {
  opacity: 0.85;
}

.punch-card.is-shaking {
  animation: shake 0.35s ease;
}

.letter-picker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.letter-picker label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--era-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.letter-picker select {
  height: 40px;
  min-width: 92px;
  padding: 0 10px;
  font-family: var(--font-mono);
  font-size: 14px;
}

.picker-note {
  color: var(--era-muted);
  font-size: 10px;
}

.codebook {
  font-size: 10px;
  color: var(--era-muted);
}

.codebook summary {
  cursor: pointer;
  color: var(--era-accent-2);
}

.codebook p {
  margin: 6px 0 0;
  font-family: var(--font-mono);
  line-height: 1.7;
  word-break: break-word;
}

/* =========================================================
   era 2 · register
   ========================================================= */
.register-scene {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.crt-monitor {
  position: relative;
  padding: 13px;
  border: 1px solid #34402f;
  border-radius: 20px;
  background: linear-gradient(180deg, #20251d, #0a0d09);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(108, 255, 158, 0.07);
}

.crt-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.tube-row {
  display: flex;
  gap: 5px;
}

.tube {
  width: 9px;
  height: 21px;
  border-radius: 5px;
  background: radial-gradient(circle at 50% 30%, #ffe4ae, #c25b18 55%, #3a1204);
  opacity: 0.8;
  animation: tubeFlicker 3.2s ease-in-out infinite;
}

.tube:nth-child(2n) {
  animation-delay: 0.4s;
}

.tube:nth-child(3n) {
  animation-delay: 0.9s;
}

.crt-tag {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: rgba(108, 255, 158, 0.55);
}

.crt-screen {
  position: relative;
  overflow: hidden;
  padding: 15px;
  border: 1px solid rgba(108, 255, 158, 0.16);
  border-radius: 11px;
  background: #03110a;
  box-shadow: inset 0 0 50px rgba(108, 255, 158, 0.08);
}

.crt-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
  opacity: 0.5;
}

.registers {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
}

.reg {
  flex: 1;
  min-width: 0;
  padding: 8px 6px;
  border: 1px solid rgba(108, 255, 158, 0.22);
  border-radius: 7px;
  background: rgba(108, 255, 158, 0.03);
  text-align: center;
}

.reg-name {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: rgba(108, 255, 158, 0.7);
}

.reg-val {
  min-height: 1.2em;
  font-family: var(--font-mono);
  font-size: clamp(22px, 3.4vw, 32px);
  font-weight: 700;
  line-height: 1.25;
  color: #b7ffd0;
  text-shadow: 0 0 14px rgba(108, 255, 158, 0.5);
}

.reg.is-hot {
  animation: regGlow 0.6s ease;
}

.crt-log {
  position: relative;
  z-index: 1;
  min-height: 76px;
  margin-top: 11px;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.7;
  color: #6cff9e;
  white-space: pre-wrap;
}

.program-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.prog-slot {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 4px 7px;
  border: 1px dashed rgba(108, 255, 158, 0.26);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.02);
  font-family: var(--font-mono);
  font-size: 10px;
  color: #b7ffd0;
}

.prog-slot.is-filled {
  border-style: solid;
  background: rgba(108, 255, 158, 0.06);
}

.slot-index {
  width: 17px;
  flex: 0 0 auto;
  font-size: 8px;
  color: rgba(108, 255, 158, 0.5);
}

.slot-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.slot-actions {
  display: flex;
  gap: 2px;
}

.mini-btn {
  width: 23px;
  height: 23px;
  padding: 0;
  border: 1px solid rgba(108, 255, 158, 0.2);
  border-radius: 4px;
  background: transparent;
  color: #6cff9e;
  font-size: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.mini-btn:hover {
  background: rgba(108, 255, 158, 0.1);
}

.instr-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
}

.instr {
  padding: 8px;
  border: 1px solid rgba(108, 255, 158, 0.2);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.03);
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.instr:hover {
  border-color: #6cff9e;
  background: rgba(108, 255, 158, 0.1);
}

.instr.is-used {
  opacity: 0.28;
  pointer-events: none;
}

/* =========================================================
   era 3 · unix
   ========================================================= */
.unix-scene {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.term-window {
  overflow: hidden;
  border: 1px solid #3a3320;
  border-radius: 10px;
  background: #0b0b08;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.term-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid #2a2416;
  background: #1a1a10;
  color: #a69b78;
  font-family: var(--font-mono);
  font-size: 9px;
}

.term-dots {
  display: flex;
  gap: 4px;
}

.term-dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5a4a2a;
}

.term-title {
  margin-left: 5px;
  letter-spacing: 0.07em;
}

.term-body {
  max-height: 238px;
  overflow: auto;
  padding: 13px 15px;
  background: radial-gradient(circle at 20% 0%, rgba(240, 198, 116, 0.06), transparent 60%);
  color: #f0c674;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.75;
}

.log-line {
  padding: 1px 2px;
  border-radius: 2px;
  white-space: pre;
  transition: background 0.2s, color 0.2s;
}

.log-line.is-hit {
  background: rgba(240, 198, 116, 0.14);
  color: #fff0c2;
}

.pipeline-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-height: 42px;
  padding: 9px 13px;
  border-top: 1px solid #2a2416;
  background: #070704;
  color: #fff0c2;
  font-family: var(--font-mono);
  font-size: 10px;
}

.pipe-cmd {
  padding: 3px 6px;
  border: 1px solid rgba(240, 198, 116, 0.25);
  border-radius: 4px;
  background: rgba(240, 198, 116, 0.06);
}

.pipe-sep {
  color: #a69b78;
}

.term-output {
  min-height: 42px;
  padding: 9px 13px;
  border-top: 1px solid #2a2416;
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: pre-wrap;
}

.command-tray {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.cmd {
  padding: 7px 8px;
  border: 1px solid var(--era-line);
  border-radius: 6px;
  background: rgba(240, 198, 116, 0.04);
  color: var(--era-text);
  font-family: var(--font-mono);
  font-size: 10px;
  cursor: pointer;
}

.cmd:hover {
  border-color: var(--era-accent);
  background: rgba(240, 198, 116, 0.1);
}

/* =========================================================
   era 4 · web
   ========================================================= */
.web-scene {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.browser-window {
  overflow: hidden;
  border: 1px solid #888;
  border-radius: 6px;
  background: #c0c0c0;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  color: #000;
}

.browser-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-bottom: 1px solid #777;
  background: linear-gradient(#f2f2f2, #bfbfbf);
  color: #222;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 9px;
}

.browser-dots {
  display: flex;
  gap: 3px;
}

.browser-dots i {
  width: 7px;
  height: 7px;
  border: 1px solid #555;
  border-radius: 50%;
  background: #888;
}

.browser-title {
  flex: 1;
  min-width: 0;
  padding: 2px 5px;
  border: 1px solid #888;
  border-radius: 2px;
  background: #fff;
  color: #333;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.browser-page {
  position: relative;
  min-height: 318px;
  padding: 20px;
  overflow: hidden;
  background: #fff;
  color: #000;
  font-family: "Times New Roman", "Songti SC", serif;
  transition: background 0.3s, color 0.3s;
}

.browser-page.bg-stars {
  background:
    radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 1.6px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 60%, #fff 0 1px, transparent 1.6px) 0 0 / 63px 63px,
    #000;
  color: #fff;
}

.browser-page.bg-stars .web-title {
  color: #ffff00;
}

.browser-page.bg-stars .web-link {
  color: #00ffff;
}

.browser-page.bg-stars .web-bio {
  color: #e8e8e8;
}

.browser-page.bg-clouds {
  background:
    radial-gradient(ellipse at 18% 18%, #fff 0 18%, transparent 19%),
    radial-gradient(ellipse at 78% 28%, #fff 0 14%, transparent 15%),
    linear-gradient(#7ec8ff, #dff3ff);
  color: #002244;
}

.browser-page.bg-checker {
  background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 32px 32px;
  color: #111;
}

.web-title {
  margin: 0 0 10px;
  color: #000080;
  font-size: clamp(21px, 3.4vw, 32px);
  line-height: 1.2;
  text-decoration: underline;
}

.web-marquee {
  margin-bottom: 10px;
  padding: 3px 0;
  overflow: hidden;
  border: 1px dashed #999;
  color: #b30000;
  font-family: Arial, sans-serif;
  font-size: 11px;
  white-space: nowrap;
}

.web-marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 9s linear infinite;
}

.web-bio {
  max-width: 60ch;
  margin: 7px 0 11px;
  font-size: 14px;
  line-height: 1.7;
}

.web-link {
  display: inline-block;
  margin-bottom: 11px;
  color: #0000ee;
  font-family: Arial, sans-serif;
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
}

.hit-counter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 11px;
  padding: 3px 5px;
  border: 1px solid #0a0;
  background: #000;
  color: #0f0;
  font-family: var(--font-mono);
  font-size: 11px;
}

.hit-digit {
  padding: 0 2px;
  background: #111;
}

.web-guestbook {
  margin-left: 6px;
  padding: 4px 7px;
  border: 2px outset #ccc;
  background: #e8e8e8;
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 10px;
  cursor: pointer;
}

.construction {
  position: absolute;
  right: 12px;
  bottom: 12px;
  padding: 5px 8px;
  border: 2px solid #000;
  background: repeating-linear-gradient(45deg, #ffd800 0 8px, #111 8px 16px);
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 800;
  transform: rotate(-6deg);
  box-shadow: 2px 2px 0 #000;
  transition: opacity 0.3s, transform 0.3s;
}

.construction.is-hidden {
  opacity: 0;
  transform: rotate(-6deg) scale(0.8);
  pointer-events: none;
}

.web-empty {
  padding-top: 86px;
  color: #888;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}

.published-banner {
  display: inline-block;
  margin-bottom: 8px;
  padding: 3px 6px;
  border: 1px solid #000;
  background: #ff0;
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 10px;
  animation: popIn 0.3s ease both;
}

.web-blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.block-chip {
  padding: 7px 8px;
  border: 1px solid var(--era-line);
  border-radius: 6px;
  background: rgba(0, 229, 255, 0.03);
  color: var(--era-text);
  font-size: 10px;
  cursor: pointer;
}

.block-chip.is-on {
  border-color: var(--era-accent);
  background: rgba(0, 229, 255, 0.12);
  color: var(--era-accent-2);
}

.block-chip .req {
  color: var(--era-accent-2);
}

.web-fields {
  display: grid;
  gap: 6px;
}

.field {
  display: grid;
  gap: 3px;
}

.field label {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.field input,
.field textarea {
  width: 100%;
  height: 36px;
  padding: 7px 9px;
  font-size: 11px;
}

.field textarea {
  height: 58px;
  resize: vertical;
}

.bg-picker {
  display: flex;
  gap: 6px;
}

.bg-swatch {
  width: 42px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--era-line);
  border-radius: 4px;
  cursor: pointer;
}

.bg-swatch.stars {
  background: radial-gradient(circle, #fff 0 1px, transparent 1.4px) 0 0 / 10px 10px, #000;
}

.bg-swatch.clouds {
  background: linear-gradient(#7ec8ff, #dff3ff);
}

.bg-swatch.checker {
  background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 10px 10px;
}

.bg-swatch.is-on {
  outline: 2px solid var(--era-accent);
  outline-offset: 2px;
}

/* =========================================================
   era 5 · cloud
   ========================================================= */
.cloud-scene {
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 18px;
  align-items: center;
}

.phone {
  position: relative;
  width: 116px;
  height: 224px;
  margin: 0 auto;
  padding: 8px;
  border: 1px solid #666;
  border-radius: 22px;
  background: linear-gradient(160deg, #2a2a2a, #050505);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 2px #111;
}

.phone-notch {
  position: absolute;
  top: 8px;
  left: 50%;
  z-index: 2;
  width: 44px;
  height: 10px;
  border-radius: 0 0 8px 8px;
  background: #050505;
  transform: translateX(-50%);
}

.phone-screen {
  position: relative;
  height: 100%;
  overflow: hidden;
  border-radius: 16px;
  background: radial-gradient(circle at 50% 20%, #12314a, #050b12 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background 0.4s;
}

.phone-status {
  position: absolute;
  top: 12px;
  left: 11px;
  right: 11px;
  display: flex;
  justify-content: space-between;
  color: #8fd8ff;
  font-family: var(--font-mono);
  font-size: 7px;
  opacity: 0.75;
}

.app-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #6fc3ff, #b18cff);
  color: #04101c;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  box-shadow: 0 8px 24px rgba(111, 195, 255, 0.35);
  transition: transform 0.3s, box-shadow 0.3s;
}

.app-name {
  color: #bfe9ff;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.08em;
}

.phone.is-live .app-icon {
  transform: scale(1.08);
  box-shadow: 0 0 32px rgba(143, 240, 255, 0.75);
}

.phone.is-live .phone-screen {
  background: radial-gradient(circle at 50% 20%, #145a3a, #050b12 70%);
}

.cloud-area {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.cloud-glow {
  position: absolute;
  top: -24px;
  left: 8%;
  right: 8%;
  height: 100px;
  background: radial-gradient(ellipse, rgba(111, 195, 255, 0.26), transparent 70%);
  filter: blur(18px);
  pointer-events: none;
}

.server-racks {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 7px;
}

.rack {
  position: relative;
  width: 40px;
  height: 62px;
  border: 1px solid rgba(111, 195, 255, 0.3);
  border-radius: 6px;
  background: linear-gradient(#0d2740, #071523);
  transition: opacity 0.2s, box-shadow 0.2s;
}

.rack::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 6px;
  right: 6px;
  height: 4px;
  border-radius: 2px;
  background: rgba(111, 195, 255, 0.14);
  box-shadow: 0 10px 0 rgba(111, 195, 255, 0.14), 0 20px 0 rgba(111, 195, 255, 0.14), 0 30px 0 rgba(111, 195, 255, 0.14);
}

.rack-led {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6cff9e;
  box-shadow: 0 0 6px #6cff9e;
}

.rack.is-off {
  opacity: 0.24;
}

.rack.is-off .rack-led {
  background: #555;
  box-shadow: none;
}

.rack.is-hot {
  box-shadow: 0 0 20px rgba(111, 195, 255, 0.4);
}

.cloud-chart {
  display: block;
  width: 100%;
  height: 104px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.22);
}

.cloud-readout {
  display: flex;
  gap: 6px;
}

.readout {
  flex: 1;
  min-width: 0;
  padding: 7px 5px;
  border: 1px solid var(--era-line);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  text-align: center;
}

.readout b {
  display: block;
  margin-top: 2px;
  color: var(--era-text);
  font-size: 15px;
}

.cloud-controls {
  display: grid;
  gap: 9px;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.range-row label {
  flex: 0 0 auto;
  color: var(--era-muted);
  font-size: 10px;
}

.range-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--era-accent);
}

.budget-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 10px;
}

.budget-line b {
  color: var(--era-accent-2);
}

.switch-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--era-muted);
  font-size: 10px;
}

.switch-row input {
  accent-color: var(--era-accent);
}

/* =========================================================
   era 6 · AI
   ========================================================= */
.ai-scene {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.ai-orb {
  position: absolute;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(143, 240, 255, 0.5), rgba(192, 132, 252, 0.24) 45%, transparent 70%);
  filter: blur(32px);
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
}

.ai-poster-wrap {
  position: relative;
  z-index: 1;
  width: min(100%, 350px);
  overflow: hidden;
  border: 1px solid var(--era-line);
  border-radius: 12px;
  background: #05060a;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.ai-poster {
  display: block;
  width: 100%;
  height: auto;
}

.ai-caption {
  position: relative;
  z-index: 1;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
}

.ai-caption span {
  color: var(--era-accent);
}

.prompt-console {
  position: relative;
  display: grid;
  gap: 7px;
  padding: 14px;
  border: 1px solid var(--era-line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.025);
  overflow: hidden;
}

.prompt-console::before {
  content: "";
  position: absolute;
  inset: -50% -20%;
  pointer-events: none;
  background:
    radial-gradient(circle at 30% 20%, rgba(143, 240, 255, 0.14), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.12), transparent 45%);
}

.prompt-console > * {
  position: relative;
  z-index: 1;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.chip {
  padding: 6px 8px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-size: 10px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.chip.is-on {
  border-color: var(--era-accent);
  background: rgba(143, 240, 255, 0.1);
  color: var(--era-accent-2);
  box-shadow: 0 0 18px rgba(143, 240, 255, 0.08);
}

.prompt-input {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  padding: 9px;
  font-size: 12px;
  line-height: 1.6;
}

.suggestion-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.suggestion {
  padding: 4px 6px;
  border: 1px dashed var(--era-line);
  border-radius: 5px;
  background: transparent;
  color: var(--era-muted);
  font-size: 9px;
  line-height: 1.5;
  text-align: left;
  cursor: pointer;
}

.suggestion:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
}

.ai-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.ai-plan {
  min-height: 116px;
  padding: 12px;
  border: 1px solid var(--era-line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.025);
}

.plan-title {
  margin-bottom: 8px;
  color: var(--era-accent-2);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.5;
}

.plan-step {
  display: flex;
  gap: 7px;
  margin-top: 6px;
  color: var(--era-muted);
  font-size: 10px;
  line-height: 1.6;
}

.step-num {
  flex: 0 0 auto;
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
}

.ai-note {
  color: var(--era-muted);
  font-size: 9px;
  line-height: 1.6;
  opacity: 0.8;
}

/* =========================================================
   result
   ========================================================= */
.result-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 54px) clamp(14px, 3vw, 24px) 80px;
}

.shared-banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 22px;
  padding: 10px 13px;
  border: 1px solid var(--era-line);
  border-radius: 9px;
  background: rgba(143, 240, 255, 0.06);
  color: var(--era-muted);
  font-size: 11px;
}

.shared-banner b {
  color: var(--era-accent-2);
}

.result-head {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.result-kicker {
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.26em;
}

.result-title {
  margin: 10px 0 11px;
  font-size: clamp(34px, 5.5vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.045em;
}

.result-sub {
  margin: 0;
  color: var(--era-muted);
  font-size: 13px;
  line-height: 1.7;
}

.result-grid {
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  gap: 16px;
  margin-top: 30px;
}

.result-card {
  padding: 22px;
  border: 1px solid var(--era-line);
  border-radius: 18px;
  background: var(--era-panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.type-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(143, 240, 255, 0.09), rgba(192, 132, 252, 0.06));
}

.type-card::before {
  content: "";
  position: absolute;
  top: -90px;
  right: -80px;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(143, 240, 255, 0.18), transparent 70%);
  pointer-events: none;
}

.type-kicker {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.22em;
}

.type-name {
  position: relative;
  margin: 10px 0 5px;
  color: var(--era-accent-2);
  font-size: clamp(38px, 5.5vw, 64px);
  line-height: 1;
  letter-spacing: -0.045em;
}

.type-en {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.type-desc {
  position: relative;
  max-width: 46ch;
  margin: 17px 0 0;
  color: var(--era-text);
  font-size: 13px;
  line-height: 1.8;
}

.type-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 17px;
}

.stat {
  min-width: 88px;
  padding: 7px 9px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
}

.stat b {
  display: block;
  margin-top: 3px;
  color: var(--era-text);
  font-size: 14px;
}

.radar-card {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.radar-title,
.poster-title {
  align-self: flex-start;
  margin-bottom: 6px;
  color: var(--era-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.radar-canvas {
  width: 100%;
  max-width: 360px;
  height: auto;
  aspect-ratio: 1;
}

.era-bars {
  display: grid;
  gap: 9px;
}

.bar-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 34px;
  gap: 8px;
  align-items: center;
}

.bar-label {
  color: var(--era-muted);
  font-size: 9px;
  white-space: nowrap;
}

.bar-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--era-accent), var(--era-accent-2));
  transition: width 1s ease;
}

.bar-val {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  text-align: right;
}

.best-era {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 13px;
  padding: 11px;
  border: 1px solid var(--era-line);
  border-radius: 11px;
}

.best-icon {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border: 1px solid var(--era-accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--era-accent);
  background: rgba(143, 240, 255, 0.06);
}

.best-icon svg {
  width: 19px;
  height: 19px;
}

.best-meta {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.best-label {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
}

.best-name {
  font-size: 14px;
  font-weight: 700;
}

.best-why {
  margin-top: 7px;
  color: var(--era-muted);

/* =========================================================
   animations
   ========================================================= */
@keyframes screenIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.97) translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes tunnelIn {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes blink {
  0%, 45% {
    opacity: 1;
  }
  46%, 100% {
    opacity: 0;
  }
}

@keyframes stampPulse {
  0%, 100% {
    box-shadow: inset 0 0 0 1px var(--era-accent), 0 0 12px rgba(143, 240, 255, 0.06);
  }
  50% {
    box-shadow: inset 0 0 0 1px var(--era-accent), 0 0 24px rgba(143, 240, 255, 0.16);
  }
}

@keyframes targetPulse {
  0%, 100% {
    box-shadow: 0 0 0 2px rgba(179, 64, 47, 0.32);
  }
  50% {
    box-shadow: 0 0 0 5px rgba(179, 64, 47, 0.5);
  }
}

@keyframes shake {
  0%, 100% {
    transform: rotate(-1.2deg) translateX(0);
  }
  25% {
    transform: rotate(-1.2deg) translateX(-5px);
  }
  75% {
    transform: rotate(-1.2deg) translateX(5px);
  }
}

@keyframes weave {
  0% {
    left: 6%;
  }
  50% {
    left: 78%;
  }
  100% {
    left: 6%;
  }
}

@keyframes tubeFlicker {
  0%, 100% {
    opacity: 0.8;
  }
  48% {
    opacity: 0.8;
  }
  50% {
    opacity: 0.55;
  }
  52% {
    opacity: 0.85;
  }
}

@keyframes regGlow {
  0%, 100% {
    box-shadow: none;
  }
  40% {
    box-shadow: 0 0 24px rgba(108, 255, 158, 0.22);
  }
}

@keyframes marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-100%);
  }
}

@keyframes float {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {

  <script>
(function (CTM) {
  "use strict";

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const clamp = (value, min, max) => Math.min(max, Math.max(min, Number(value) || 0));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const prefersReduced = () =>
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const escapeHtml = (value) =>
    String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  const base64Encode = (str) => {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    bytes.forEach((byte) => {
      binary += String.fromCharCode(byte);
    });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  };

  const base64Decode = (str) => {
    let normalized = String(str).replace(/-/g, "+").replace(/_/g, "/");
    while (normalized.length % 4) normalized += "=";
    const binary = atob(normalized);
    const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  };

  const encodeShare = (payload) => base64Encode(JSON.stringify(payload));
  const decodeShare = (value) => {
    try {
      const parsed = JSON.parse(base64Decode(value));
      return parsed && typeof parsed === "object" ? parsed : null;
    } catch (error) {
      return null;
    }
  };

  const formatDuration = (start, end) => {
    if (!start) return "—";
    const totalSeconds = Math.max(0, Math.round(((end || Date.now()) - start) / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  };

  const initialScores = () => ({ manual: 0, systems: 0, expression: 0, direction: 0 });

  const state = {
    traveler: "",
    eraIndex: 0,
    stamps: [],
    scores: initialScores(),
    eraScores: [null, null, null, null, null, null],
    choices: {},
    ai: null,
    sound: false,
    started: false,
    completed: false,
    startedAt: null,
    finishedAt: null,
    shared: false,
  };

  CTM.$ = $;
  CTM.$$ = $$;
  CTM.state = state;
  CTM.eras = CTM.eras || [];
  CTM.utils = {
    clamp,
    sleep,
    prefersReduced,
    escapeHtml,
    base64Encode,
    base64Decode,
    encodeShare,
    decodeShare,
    formatDuration,
  };

  CTM.icons = {
    punch:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/></svg>',
    register:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>',
    unix:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6l5 5-5 5"/><path d="M11 17h9"/></svg>',
    web:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/><circle cx="6" cy="6" r=".7" fill="currentColor" stroke="none"/><circle cx="8.5" cy="6" r=".7" fill="currentColor" stroke="none"/><circle cx="11" cy="6" r=".7" fill="currentColor" stroke="none"/></svg>',
    cloud:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.3 9.1 4.5 4.5 0 0 1 17 18H7z"/><path d="M12 12v5M9.8 14.2 12 12l2.2 2.2"/></svg>',
    ai:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/><circle cx="12" cy="12" r="2.5"/></svg>',
  };

  const STORAGE_KEY = "ctm-1024-v1";

  CTM.storage = {
    save() {
      try {
        const payload = {
          traveler: state.traveler,
          eraIndex: state.eraIndex,
          stamps: state.stamps,
          scores: state.scores,
          eraScores: state.eraScores,
          choices: state.choices,
          ai: state.ai,
          sound: state.sound,
          started: state.started,
          completed: state.completed,
          startedAt: state.startedAt,
          finishedAt: state.finishedAt,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (error) {
        /* storage can be unavailable in private mode */
      }
    },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : null;
      } catch (error) {
        return null;
      }
    },
    clear() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        /* ignore */
      }
    },
  };

  const ui = {
    showScreen(name) {
      $$(".screen").forEach((screen) => screen.classList.remove("is-active"));
      const target = document.getElementById(`screen-${name}`);
      if (target) target.classList.add("is-active");

      document.body.classList.toggle("is-landing", name === "landing");
      document.body.classList.toggle("is-era", name === "era");
      document.body.classList.toggle("is-result", name === "result");
      document.body.classList.toggle("is-future", name === "future");

      const passport = $("#passport");
      if (passport) passport.hidden = name !== "era";
      const topProgress = $("#top-progress");
      if (topProgress) topProgress.hidden = name !== "era";

      window.scrollTo({ top: 0, behavior: prefersReduced() ? "auto" : "smooth" });
    },

    setTheme(theme) {
      document.body.dataset.era = theme || "landing";
    },

    toast(message, duration) {
      const el = $("#toast");
      if (!el) return;
      el.textContent = message;
      el.classList.add("is-visible");
      clearTimeout(ui._toastTimer);
      ui._toastTimer = setTimeout(() => el.classList.remove("is-visible"), duration || 2400);
    },

    modal(html, options) {
      const opts = options || {};
      const root = $("#modal-root");
      if (!root) return function noop() {};
      root.innerHTML = `<div class="modal-backdrop"></div><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</div>`;
      root.hidden = false;

      const close = () => ui.closeModal();
      const backdrop = $(".modal-backdrop", root);
      if (opts.dismissible !== false && backdrop) {
        backdrop.addEventListener("click", close);
      }
      $$("[data-modal-close]", root).forEach((button) => {
        button.addEventListener("click", close);
      });

      const onKey = (event) => {
        if (event.key === "Escape" && opts.dismissible !== false) close();

        master.gain.value = 0.55;
        master.connect(ctx.destination);
      } catch (error) {
        ctx = null;
        master = null;
      }
    },

    restore(enabled) {
      audio.enabled = Boolean(enabled);
      audio.updateButtons();
    },

    setEnabled(enabled) {
      audio.enabled = Boolean(enabled);

        CTM.state.sound = audio.enabled;
        if (CTM.storage) CTM.storage.save();
      }
    },

    toggle() {
      audio.setEnabled(!audio.enabled);
    },

    updateButtons() {
      const label = audio.enabled ? "声音：开" : "声音：关";
      ["sound-toggle", "sound-toggle-2"].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.setAttribute("aria-pressed", String(audio.enabled));
        el.setAttribute("aria-label", audio.enabled ? "关闭音效" : "开启音效");
        const text = el.querySelector(".sound-label");
        if (text) text.textContent = label;
        if (id === "sound-toggle-2") el.textContent = label;
      });
    },

    tone(frequency, duration, type, volume, delay, slideTo) {
      if (!audio.enabled) return;
      if (!ctx) audio.init();
      if (!ctx || !master) return;
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      try {
        const start = ctx.currentTime + (delay || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(Math.max(20, frequency), start);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), start + duration);
        }
        const level = Math.max(0.0001, volume == null ? 0.04 : volume);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(level, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

        gain.connect(master);
        osc.start(start);
        osc.stop(start + duration + 0.03);

    },

      audio.tone(110, 0.18, "sawtooth", 0.03, 0.09);
    },

      audio.tone(1568, 0.16, "sine", 0.018, 0.05);
    },

          CTM.audio.success();
          const score = {
            systems: Math.max(8, 20 - local.errors * 4),
            manual: 5,
          };
          const successHtml = `你用 4 条指令让机器输出了 <b>7</b>。1945 年的人，就是这样和机器说话的。你犯了 ${local.errors} 次错误。`;
          setTimeout(() => api.complete(score, { program: local.program.slice(), errors: local.errors }, successHtml), 700);
          return;
        }

        local.errors += 1;
        const output = local.registers.OUT === null ? "--" : local.registers.OUT;
        log(`OUTPUT: ${output} / TARGET: 7`);
        if (local.errors >= 2) {
          api.feedback("机器没得到 7。提示：先 LOAD A，再 LOAD B，然后 ADD A B，最后 OUT A。", "error");
        } else {
          api.feedback(`输出是 ${output}，不是 7。检查一下指令的顺序。`, "error");
        }
        CTM.audio.error();
      };

      const runAll = async () => {
        if (local.running || local.locked) return;
        if (!local.program.length) {
          api.feedback("先从指令池里选指令。", "error");
          return;
        }
        if (local.program.length < 4) {
          api.feedback(`机器需要 4 条指令，现在只有 ${local.program.length} 条。`, "error");
          return;
        }
        local.running = true;
        resetMachine(true);
        renderAll();
        log(`> RUN ${local.program.length} INSTRUCTIONS`);
        await CTM.utils.sleep(reduced ? 120 : 380);

        let jumped = false;
        for (const id of local.program) {
          if (jumped) break;
          const result = executeInstruction(id);
          if (result.jumped) {
            jumped = true;
            break;
          }
          await CTM.utils.sleep(reduced ? 80 : 440);
        }

        if (jumped) {
          local.running = false;
          local.errors += 1;
          renderAll();
          api.feedback("JMP 0 把程序计数器带回了起点，机器过热了。换一条指令吧。", "error");
          CTM.audio.error();
          return;
        }
        finish();
      };

      const stepOnce = async () => {
        if (local.running || local.locked) return;
        if (!local.program.length) {
          api.feedback("先选指令，再单步执行。", "error");
          return;
        }
        if (local.stepIndex === 0) resetMachine(true);
        local.running = true;
        renderAll();
        const id = local.program[local.stepIndex];
        if (!id) {
          local.running = false;
          finish();
          return;
        }
        const result = executeInstruction(id);
        local.stepIndex += 1;
        await CTM.utils.sleep(reduced ? 80 : 300);
        if (result.jumped) {
          local.running = false;
          local.errors += 1;
          renderAll();
          api.feedback("JMP 0 让程序计数器回到了起点。机器过热。", "error");
          CTM.audio.error();
          return;
        }
        if (local.stepIndex >= local.program.length) {
          finish();
          return;
        }
        local.running = false;
        renderAll();
        api.feedback(`已执行 ${local.stepIndex} / ${local.program.length} 条。继续单步，或直接运行。`, "");
      };

      const onProgramClick = (event) => {
        if (local.running || local.locked) return;
        const move = event.target.closest("[data-move]");
        if (move) {
          const index = Number(move.dataset.index);
          const dir = move.dataset.move;
          const target = dir === "up" ? index - 1 : index + 1;
          if (target < 0 || target >= local.program.length) return;
          const temp = local.program[index];
          local.program[index] = local.program[target];
          local.program[target] = temp;
          renderAll();
          CTM.audio.click();
          return;
        }
        const remove = event.target.closest("[data-remove]");
        if (remove) {
          local.program.splice(Number(remove.dataset.remove), 1);
          renderAll();
          CTM.audio.glitch();
        }
      };

      const onTrayClick = (event) => {
        const button = event.target.closest("[data-instr]");
        if (!button || local.running || local.locked) return;
        if (local.program.length >= 4) {
          api.feedback("程序只有 4 个槽位。先移除一条，再选新的。", "error");
          return;
        }
        local.program.push(button.dataset.instr);
        renderAll();
        CTM.audio.click();
      };

      const onReset = () => {
        if (local.running) return;
        local.program = [];
        local.errors = 0;
        local.stepIndex = 0;
        local.locked = false;
        local.running = false;
        resetMachine(true);
        renderAll();
        api.feedback("机器已重置。先从指令池里选 4 条。", "");
        CTM.audio.click();
      };

      programEl.addEventListener("click", onProgramClick);
      trayEl.addEventListener("click", onTrayClick);
      runBtn.addEventListener("click", runAll);
      stepBtn.addEventListener("click", stepOnce);
      resetBtn.addEventListener("click", onReset);

      renderAll();

      return () => {
        programEl.removeEventListener("click", onProgramClick);
        trayEl.removeEventListener("click", onTrayClick);
        runBtn.removeEventListener("click", runAll);
        stepBtn.removeEventListener("click", stepOnce);
        resetBtn.removeEventListener("click", onReset);
      };
    },
  });
})(window.CTM = window.CTM || {});

    mount(scene, panel, api) {
      const logEl = scene.querySelector("[data-log]");
      const pipelineEl = scene.querySelector("[data-pipeline]");
      const outputEl = scene.querySelector("[data-output]");
      const trayEl = panel.querySelector("[data-tray]");
      const runBtn = panel.querySelector("[data-run]");
      const undoBtn = panel.querySelector("[data-undo]");
      const resetBtn = panel.querySelector("[data-reset]");
      const lineEls = Array.from(scene.querySelectorAll(".log-line"));

      const local = {
        pipeline: ["cat access.log"],
        errors: 0,
        locked: false,
      };

      const renderPipeline = () => {
        const parts = local.pipeline.map(
          (command) => `<span class="pipe-cmd">${CTM.utils.escapeHtml(command)}</span>`
        );
        pipelineEl.innerHTML = parts.join('<span class="pipe-sep">|</span>');
      };

      const setBusy = (busy) => {
        runBtn.disabled = busy;
        undoBtn.disabled = busy;
        resetBtn.disabled = busy;
        trayEl.querySelectorAll("button").forEach((button) => {
          button.disabled = busy;
        });
      };

      const clearHighlights = () => {
        lineEls.forEach((el) => el.classList.remove("is-hit"));
      };

      const setOutput = (text) => {
        outputEl.textContent = text;
      };

      const evaluate = () => {
        let lines = LOG_LINES.slice();
        let count = null;
        for (const command of local.pipeline.slice(1)) {
          if (command === "grep ERROR") {
            lines = lines.filter((line) => line.includes("ERROR"));
          } else if (command === "grep 500") {
            lines = lines.filter((line) => line.includes("500"));
          } else if (command === "grep 404") {
            lines = lines.filter((line) => line.includes("404"));
          } else if (command === "sort") {
            lines = lines.slice().sort();
          } else if (command === "uniq -c") {
            const counts = new Map();
            lines.forEach((line) => counts.set(line, (counts.get(line) || 0) + 1));
            lines = Array.from(counts.entries()).map(([line, amount]) => `${amount} ${line}`);
          } else if (command === "wc -l") {
            count = lines.length;
          }
        }
        return { lines, count };
      };

      const highlightSuccess = () => {
        lineEls.forEach((el, index) => {
          if (LOG_LINES[index].includes("500") && LOG_LINES[index].includes("ERROR")) {

            700
          );

        }

        local.errors += 1;

          const usedError = local.pipeline.includes("grep ERROR");
          const used500 = local.pipeline.includes("grep 500");

          goal: local.generated.goal,
          style: local.generated.style,
          prompt,
          seed: local.generated.seed,
          plan: local.generated.steps.slice(),

          () => !local.cancelled && api.complete(score, { ...CTM.state.ai }, successHtml),
          700
        );

      stylesEl.addEventListener("click", onStyleClick);
      promptInput.addEventListener("input", onPromptInput);
      suggestionsEl.addEventListener("click", onSuggestion);
      generateBtn.addEventListener("click", onGenerate);
      regenBtn.addEventListener("click", onRegen);
      adoptBtn.addEventListener("click", onAdopt);

      renderChips();
      renderPlan();
      renderPoster();

      return () => {
        local.cancelled = true;
        if (local.completeTimer) clearTimeout(local.completeTimer);
        goalsEl.removeEventListener("click", onGoalClick);
        stylesEl.removeEventListener("click", onStyleClick);
        promptInput.removeEventListener("input", onPromptInput);
        suggestionsEl.removeEventListener("click", onSuggestion);
        generateBtn.removeEventListener("click", onGenerate);
        regenBtn.removeEventListener("click", onRegen);
        adoptBtn.removeEventListener("click", onAdopt);

    },

    state.choices = saved.choices && typeof saved.choices === "object" ? saved.choices : {};
    state.ai = saved.ai && typeof saved.ai === "object" ? saved.ai : null;
    state.sound = Boolean(saved.sound);
    state.started = Boolean(saved.started) || state.stamps.length > 0 || Boolean(saved.completed);
    state.completed = Boolean(saved.completed) || state.stamps.length >= ERAS.length;
    state.startedAt = Number(saved.startedAt) || null;
    state.finishedAt = Number(saved.finishedAt) || null;
    if (state.completed) {
      state.eraIndex = ERAS.length;
      if (state.stamps.length < ERAS.length) {
        state.stamps = ERAS.map((_, index) => index);
      }
    }

    audio.restore(state.sound);
    const input = $("#traveler");
    if (input && state.traveler) input.value = state.traveler;
    updateContinueUI();
  }

  function updateContinueUI() {
