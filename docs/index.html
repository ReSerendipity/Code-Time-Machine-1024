<html lang="zh-CN">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070b10'/%3E%3Ctext x='32' y='41' font-size='20' font-family='monospace' fill='%238ff0ff' text-anchor='middle'%3E1024%3C/text%3E%3C/svg%3E">
  <title>代码时间机器 · 1024 Builder 作品秀</title>
  <style>
/* =========================================================
   代码时间机器 · global design system
   ========================================================= */
:root {
  --topbar-h: 64px;
  --passport-h: 78px;
  --era-bg: #07090c;
  --era-bg-2: #10131a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #eef2f8;
  --era-muted: #8b94a7;
  --era-line: rgba(143, 240, 255, 0.22);
  --era-panel: rgba(255, 255, 255, 0.035);
  --era-warn: #ff8b8b;
  --era-ok: #8ff0a8;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", "Courier New", monospace;
}

body[data-era="landing"] {
  --era-bg: #07090c;
  --era-bg-2: #10131a;
  --era-accent: #8ff0ff;
  --era-accent-2: #e0a458;
  --era-text: #eef2f8;
  --era-muted: #8b94a7;
  --era-line: rgba(143, 240, 255, 0.2);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="punch"] {
  --era-bg: #160f09;
  --era-bg-2: #2b1c10;
  --era-accent: #e0a458;
  --era-accent-2: #f2d0a4;
  --era-text: #f6e8d3;
  --era-muted: #b59a7a;
  --era-line: rgba(224, 164, 88, 0.32);
  --era-panel: rgba(42, 28, 16, 0.64);
}

body[data-era="register"] {
  --era-bg: #03110a;
  --era-bg-2: #061f12;
  --era-accent: #6cff9e;
  --era-accent-2: #b7ffd0;
  --era-text: #d8ffe4;
  --era-muted: #6f9f80;
  --era-line: rgba(108, 255, 158, 0.28);
  --era-panel: rgba(4, 24, 14, 0.68);
}

body[data-era="unix"] {
  --era-bg: #0b0b08;
  --era-bg-2: #1a1a10;
  --era-accent: #f0c674;
  --era-accent-2: #fff0c2;
  --era-text: #f4f0e0;
  --era-muted: #a69b78;
  --era-line: rgba(240, 198, 116, 0.28);
  --era-panel: rgba(26, 26, 16, 0.62);
}

body[data-era="web"] {
  --era-bg: #0a0c2a;
  --era-bg-2: #131a4a;
  --era-accent: #00e5ff;
  --era-accent-2: #ff4fd8;
  --era-text: #eef2ff;
  --era-muted: #9aa6d8;
  --era-line: rgba(0, 229, 255, 0.28);
  --era-panel: rgba(19, 26, 74, 0.6);
}

body[data-era="cloud"] {
  --era-bg: #06121f;
  --era-bg-2: #0b2036;
  --era-accent: #6fc3ff;
  --era-accent-2: #b18cff;
  --era-text: #eaf6ff;
  --era-muted: #8aa6c2;
  --era-line: rgba(111, 195, 255, 0.28);
  --era-panel: rgba(11, 32, 54, 0.62);
}

body[data-era="ai"] {
  --era-bg: #05060a;
  --era-bg-2: #0d0a1a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #f2f5ff;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.24);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="result"] {
  --era-bg: #05060a;
  --era-bg-2: #0d0a1a;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #f2f5ff;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.22);
  --era-panel: rgba(255, 255, 255, 0.035);
}

body[data-era="future"] {
  --era-bg: #000;
  --era-bg-2: #000;
  --era-accent: #8ff0ff;
  --era-accent-2: #c084fc;
  --era-text: #eef2f8;
  --era-muted: #98a0bf;
  --era-line: rgba(143, 240, 255, 0.2);
  --era-panel: rgba(255, 255, 255, 0.03);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--era-bg);
  color: var(--era-text);
  font-family: var(--font-sans);
  line-height: 1.5;
  overflow-x: hidden;
  transition: background-color 0.6s ease, color 0.6s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 16% -8%, rgba(143, 240, 255, 0.08), transparent 38%),
    radial-gradient(ellipse at 88% 8%, rgba(192, 132, 252, 0.07), transparent 42%),
    radial-gradient(ellipse at 50% 108%, rgba(224, 164, 88, 0.05), transparent 46%);
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

[hidden] {
  display: none !important;
}

::selection {
  background: var(--era-accent);
  color: #071016;
}

:focus-visible {
  outline: 2px solid var(--era-accent);
  outline-offset: 2px;
}

/* =========================================================
   top bar
   ========================================================= */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 60;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 clamp(14px, 3vw, 32px);
  background: rgba(7, 9, 12, 0.76);
  border-bottom: 1px solid var(--era-line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--era-text);
  cursor: pointer;
  text-align: left;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border: 1px solid var(--era-accent);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: 0.02em;
  color: var(--era-accent);
  box-shadow: inset 0 0 18px rgba(143, 240, 255, 0.08);
  position: relative;
}

.brand-mark::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--era-accent);
  right: 4px;
  top: 4px;
  opacity: 0.7;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-text strong {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  font-weight: 600;
}

.brand-text small {
  font-size: 10px;
  color: var(--era-muted);
  letter-spacing: 0.08em;
}

.top-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  margin-right: 4px;
}

.tp-count {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--era-muted);
  white-space: nowrap;
}

.tp-bar {
  width: 112px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.tp-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--era-accent), var(--era-accent-2));
  transition: width 0.5s ease;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 10px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--era-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 11px;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.icon-btn:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
  background: rgba(255, 255, 255, 0.06);
}

.sound-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--era-muted);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
  transition: background 0.2s, box-shadow 0.2s;
}

.sound-btn[aria-pressed="true"] .sound-dot {
  background: var(--era-accent);
  box-shadow: 0 0 10px var(--era-accent);
}

.help-btn {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
}

/* =========================================================
   layout / screens
   ========================================================= */
#app {
  position: relative;
  z-index: 1;
}

#main {
  position: relative;
  padding-top: var(--topbar-h);
  padding-bottom: calc(var(--passport-h) + 24px);
}

body.is-landing #main,
body.is-result #main,
body.is-future #main {
  padding-bottom: 0;
}

body.is-future #topbar,
body.is-future #passport {
  display: none;
}

body.is-future #main {
  padding-top: 0;
}

.screen {
  display: none;
  min-height: calc(100vh - var(--topbar-h) - var(--passport-h) - 24px);
}

.screen.is-active {
  display: block;
  animation: screenIn 0.4s ease both;
}

#screen-future.is-active {
  display: grid;
}

/* =========================================================
   typography & common controls
   ========================================================= */
.btn {
  height: 44px;
  padding: 0 18px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--era-text);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
  border-color: var(--era-accent);
  background: rgba(255, 255, 255, 0.07);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.38;
  pointer-events: none;
}

.btn-primary {
  background: var(--era-accent);
  border-color: var(--era-accent);
  color: #071016;
  box-shadow: 0 10px 34px rgba(143, 240, 255, 0.16);
}

.btn-primary:hover {
  background: var(--era-accent);
  filter: brightness(1.08);
}

.btn-ghost {
  background: transparent;
}

.btn-quiet {
  height: 36px;
  padding: 0 10px;
  border-color: transparent;
  background: transparent;
  color: var(--era-muted);
  font-weight: 500;
}

.btn-quiet:hover {
  color: var(--era-text);
  background: rgba(255, 255, 255, 0.05);
}

.linkish {
  padding: 0;
  border: 0;
  background: none;
  color: var(--era-accent-2);
  font-size: inherit;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

input,
textarea,
select {
  color: var(--era-text);
  background: rgba(0, 0, 0, 0.24);
  border: 1px solid var(--era-line);
  border-radius: 8px;
  padding: 0.72em 0.9em;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder,
textarea::placeholder {
  color: var(--era-muted);
  opacity: 0.75;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--era-accent);
  box-shadow: 0 0 0 3px rgba(143, 240, 255, 0.08);
}

code,
kbd {
  font-family: var(--font-mono);
}

/* =========================================================
   landing
   ========================================================= */
#screen-landing {
  position: relative;
  overflow: hidden;
  min-height: calc(100vh - var(--topbar-h));
}

#landing-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.52;
  pointer-events: none;
}

.landing-inner {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: clamp(36px, 7vh, 88px) 22px 70px;
  text-align: center;
}

.hero-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--era-accent);
  text-transform: uppercase;
}

.hero-title {
  margin: 14px 0 18px;
  font-size: clamp(42px, 10.5vw, 132px);
  line-height: 0.86;
  letter-spacing: -0.06em;
  font-weight: 800;
  color: var(--era-text);
  text-wrap: balance;
}

.hero-title span {
  color: var(--era-accent-2);
  position: relative;
  display: inline-block;
}

.hero-title span::after {
  content: "";
  position: absolute;
  left: 3%;
  right: 3%;
  bottom: 0.08em;
  height: 0.055em;
  background: var(--era-accent);
  opacity: 0.65;
  transform: skewX(-18deg);
}

.hero-sub {
  margin: 0 auto;
  max-width: 580px;
  color: var(--era-muted);
  font-size: clamp(14px, 1.8vw, 18px);
  line-height: 1.7;
}

.console {
  max-width: 640px;
  margin: 34px auto 0;
  text-align: left;
  border: 1px solid var(--era-line);
  border-radius: 14px;
  background: rgba(8, 10, 14, 0.82);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.025);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow: hidden;
}

.console-bar {
  height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 13px;
  border-bottom: 1px solid var(--era-line);
  background: rgba(255, 255, 255, 0.025);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--era-muted);
}

.console-dots {
  display: flex;
  gap: 4px;
}

.console-dots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #5a5f6a;
}

.console-dots i:nth-child(1) {
  background: #ff6b6b;
}

.console-dots i:nth-child(2) {
  background: #ffd166;
}

.console-dots i:nth-child(3) {
  background: #6cff9e;
}

.console-title {
  letter-spacing: 0.06em;
}

.console-status {
  margin-left: auto;
  color: var(--era-ok);
  font-size: 9px;
  letter-spacing: 0.18em;
}

.boot-log {
  min-height: 116px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--era-line);
  background:
    radial-gradient(circle at 20% 0%, rgba(108, 255, 158, 0.06), transparent 55%),
    rgba(0, 0, 0, 0.18);
  color: #9fe8b0;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.85;
  white-space: pre-wrap;
  text-shadow: 0 0 14px rgba(108, 255, 158, 0.18);
}

.boot-line {
  display: block;
}

.boot-cursor {
  display: inline-block;
  width: 7px;
  height: 12px;
  margin-left: 2px;
  vertical-align: -1px;
  background: #9fe8b0;
  animation: blink 1.1s steps(1, end) infinite;
}

.start-form {
  display: grid;
  gap: 9px;
  padding: 16px 18px 18px;
}

.start-form > label {
  font-size: 11px;
  color: var(--era-muted);
}

.start-form > label span {
  opacity: 0.65;
  margin-left: 4px;
}

.start-row {
  display: flex;
  gap: 8px;
}

.start-row input {
  flex: 1;
  min-width: 0;
  height: 44px;
  font-size: 14px;
}

.start-row .btn {
  flex: 0 0 auto;
}

.continue-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 18px 16px;
}

.continue-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--era-muted);
}

.console-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 18px;
  border-top: 1px solid var(--era-line);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--era-muted);
}

.era-teaser {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  margin-top: 26px;
}

.teaser-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.03em;
}

.teaser-chip b {
  color: var(--era-accent);
  font-weight: 700;
}

.landing-hint {
  margin: 18px 0 0;
  font-size: 11px;
  color: var(--era-muted);
  opacity: 0.75;
}

kbd {
  display: inline-block;
  padding: 2px 5px;
  border: 1px solid var(--era-line);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 10px;
}

/* =========================================================
   passport
   ========================================================= */
.passport {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 55;
  height: var(--passport-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 clamp(14px, 3vw, 32px);
  background: rgba(7, 9, 12, 0.84);
  border-top: 1px solid var(--era-line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.passport-label {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 70px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--era-muted);
}

.passport-label strong {
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--era-text);
  font-weight: 600;
}

.passport-track {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  max-width: 1180px;
  margin: 0 auto;
}

.p-stamp {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  opacity: 0.4;
  transition: opacity 0.3s, border-color 0.3s, background 0.3s, color 0.3s;
}

.p-icon {
  width: 26px;
  height: 26px;
  border: 1px solid var(--era-line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--era-muted);
}

.p-icon svg {
  width: 14px;
  height: 14px;
}

.p-meta {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 0;
}

.p-year {
  font-family: var(--font-mono);
  font-size: 8px;
  line-height: 1.3;
  color: var(--era-muted);
}

.p-label {
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.p-stamp.is-done {
  opacity: 1;
  border-color: var(--era-line);
  background: rgba(255, 255, 255, 0.025);
  color: var(--era-accent-2);
}

.p-stamp.is-done .p-icon {
  color: var(--era-accent);
  border-color: var(--era-accent);
  background: rgba(143, 240, 255, 0.06);
}

.p-stamp.is-current {
  opacity: 1;
  border-color: var(--era-accent);
  box-shadow: inset 0 0 0 1px var(--era-accent), 0 0 22px rgba(143, 240, 255, 0.08);
  animation: stampPulse 2.4s ease-in-out infinite;
}

/* =========================================================
   tunnel
   ========================================================= */
.tunnel {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: #000;
  display: grid;
  place-items: center;
  overflow: hidden;
}

#tunnel-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.tunnel-hud {
  position: relative;
  z-index: 1;
  text-align: center;
  pointer-events: none;
  animation: tunnelIn 0.5s ease both;
}

.tunnel-year {
  font-family: var(--font-mono);
  font-size: clamp(64px, 15vw, 180px);
  font-weight: 800;
  line-height: 0.9;
  letter-spacing: -0.07em;
  color: #fff;
  text-shadow: 0 0 40px rgba(143, 240, 255, 0.45), 0 0 120px rgba(192, 132, 252, 0.25);
}

.tunnel-label {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  color: #8ff0ff;
  text-transform: uppercase;
}

#tunnel-skip {
  pointer-events: auto;
  margin-top: 26px;
  color: #9aa;
}

/* =========================================================
   modal & toast
   ========================================================= */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.modal-card {
  position: relative;
  width: min(560px, 100%);
  max-height: 90vh;
  overflow: auto;
  padding: 30px 28px;
  border: 1px solid var(--era-line);
  border-radius: 18px;
  background: #0b0e13;
  color: var(--era-text);
  box-shadow: 0 40px 120px rgba(0, 0, 0, 0.65);
  animation: popIn 0.25s ease both;
}

.modal-kicker {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  color: var(--era-muted);
  text-transform: uppercase;
}

.modal-title {
  margin: 8px 0 12px;
  font-size: clamp(24px, 4vw, 34px);
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.modal-success {
  margin: 10px 0 22px;
  color: var(--era-muted);
  font-size: 14px;
  line-height: 1.8;
}

.modal-success b {
  color: var(--era-accent-2);
}

.modal-success code {
  color: var(--era-accent);
  background: rgba(143, 240, 255, 0.07);
  border: 1px solid var(--era-line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.92em;
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.stamp-big {
  position: relative;
  width: 108px;
  height: 108px;
  margin: 0 auto 20px;
  border: 2px solid var(--era-accent);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  transform: rotate(-7deg);
  box-shadow: inset 0 0 40px rgba(143, 240, 255, 0.1), 0 0 50px rgba(143, 240, 255, 0.08);
}

.stamp-big::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed currentColor;
  border-radius: 50%;
  opacity: 0.45;
}

.stamp-big svg {
  width: 32px;
  height: 32px;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--era-line);
  border-radius: 50%;
  background: transparent;
  color: var(--era-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
}

.help-content {
  display: grid;
  gap: 12px;
  color: var(--era-muted);
  font-size: 13px;
  line-height: 1.75;
}

.help-content h3 {
  margin: 8px 0 0;
  color: var(--era-text);
  font-size: 13px;
}

.help-list {
  margin: 0;
  padding-left: 18px;
}

.help-list li {
  margin: 4px 0;
}

.help-content kbd {
  color: var(--era-accent-2);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--passport-h) + 18px);
  z-index: 120;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 15px;
  border: 1px solid var(--era-line);
  border-radius: 9px;
  background: #0c1017;
  color: var(--era-text);
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
  transform: translate(-50%, 10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   rooms · 每一站是一种不同的空间
   ========================================================= */
#era-root {
  width: 100%;
}

body.has-cheat .room {
  padding-top: 118px;
}

.room {
  position: relative;
  width: 100%;
  max-width: 1380px;
  min-height: calc(100vh - var(--topbar-h) - var(--passport-h));
  margin: 0 auto;
  padding: clamp(14px, 2.4vw, 28px) clamp(12px, 3vw, 34px) clamp(96px, 12vh, 130px);
  display: grid;
  gap: clamp(12px, 1.7vw, 20px);
  align-content: center;
}

.room-sign {
  position: relative;
  justify-self: start;
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  padding: 9px 15px;
  border: 1px solid rgba(224, 164, 88, 0.55);
  border-radius: 3px;
  background: linear-gradient(180deg, #4a2f16, #2a1a0c);
  color: #f2d0a4;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.09);
}

.room-sign::before,
.room-sign::after {
  content: "";
  position: absolute;
  top: -15px;
  width: 1px;
  height: 15px;
  background: rgba(224, 164, 88, 0.45);
}

.room-sign::before {
  left: 16px;
}

.room-sign::after {
  right: 16px;
}

.room-sign span {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(242, 208, 164, 0.62);
}

/* --- 1804 · 工坊 --- */
.room-punch {
  justify-items: center;
  background:
    radial-gradient(ellipse at 50% -6%, rgba(224, 164, 88, 0.16), transparent 58%),
    repeating-linear-gradient(0deg, rgba(224, 164, 88, 0.045) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, rgba(224, 164, 88, 0.032) 0 1px, transparent 1px 38px);
  border-radius: 20px;
}

/* --- 1945 · 控制台 --- */
.room-register {
  grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
  grid-template-areas:
    "plate plate"
    "bay desk";
  align-items: start;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(108, 255, 158, 0.1), transparent 52%),
    linear-gradient(180deg, rgba(6, 26, 15, 0.85), rgba(2, 10, 6, 0.95));
  border: 1px solid rgba(108, 255, 158, 0.16);
  border-radius: 18px;
  box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.55);
}

.room-register::after {
  content: "";
  position: absolute;
  inset: 10px;
  pointer-events: none;
  border-radius: 14px;
  background-image: radial-gradient(circle, rgba(108, 255, 158, 0.12) 0 1.6px, transparent 2.2px);
  background-size: 30px 30px;
  opacity: 0.35;
}

.machine-plate {
  grid-area: plate;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 14px;
  border: 1px solid rgba(108, 255, 158, 0.32);
  border-radius: 4px;
  background: linear-gradient(180deg, #1a2b1f, #0a130d);
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(108, 255, 158, 0.16), 0 10px 24px rgba(0, 0, 0, 0.45);
}

.machine-plate span {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: rgba(108, 255, 158, 0.55);
}

/* --- 1972 · 电传机 --- */
.room-unix {
  justify-items: center;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(240, 198, 116, 0.14), transparent 60%),
    linear-gradient(180deg, rgba(26, 26, 16, 0.75), rgba(8, 8, 5, 0.95));
  border-radius: 18px;
}

/* --- 1991 · 桌面 --- */
.room-web {
  grid-template-columns: 86px minmax(0, 1.08fr) minmax(288px, 0.92fr);
  grid-template-areas:
    "icons browser tools"
    "bar bar bar";
  align-items: start;
  background:
    radial-gradient(circle at 16% 8%, rgba(0, 229, 255, 0.14), transparent 46%),
    linear-gradient(180deg, rgba(19, 26, 74, 0.8), rgba(10, 12, 42, 0.96));
  border: 1px solid rgba(0, 229, 255, 0.16);
  border-radius: 16px;
}

/* --- 2007 · 仪表盘 --- */
.room-cloud {
  background:
    radial-gradient(ellipse at 78% -12%, rgba(177, 140, 255, 0.14), transparent 52%),
    radial-gradient(ellipse at 12% 110%, rgba(111, 195, 255, 0.12), transparent 50%),
    linear-gradient(180deg, rgba(11, 32, 54, 0.7), rgba(6, 18, 31, 0.96));
  border: 1px solid rgba(111, 195, 255, 0.16);
  border-radius: 18px;
}

/* --- 2026 · 对话 --- */
.room-ai {
  grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
  align-items: start;
  background:
    radial-gradient(ellipse at 84% 6%, rgba(192, 132, 252, 0.16), transparent 50%),
    radial-gradient(ellipse at 6% 92%, rgba(143, 240, 255, 0.12), transparent 48%);
  border-radius: 20px;
}

/* --- 完成提示：不属于同一套弹窗 --- */
.era-continue {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--passport-h) + 20px);
  z-index: 44;
  width: max-content;
  max-width: min(92vw, 700px);
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 9px 9px 14px;
  border: 1px solid var(--era-accent);
  border-radius: 999px;
  background: rgba(6, 10, 14, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6), 0 0 0 4px rgba(143, 240, 255, 0.07);
  animation: continueIn 0.42s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

.era-continue.is-leaving {
  animation: continueOut 0.24s ease both;
}

.ec-stamp {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--era-accent);
  border-radius: 50%;
  background: rgba(143, 240, 255, 0.08);
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 800;
  line-height: 1;
  animation: stampDrop 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

.ec-stamp svg {
  width: 16px;
  height: 16px;
}

.ec-text {
  display: grid;
  flex: 1;
  gap: 1px;
  min-width: 0;
}

.ec-text b {
  font-size: 13px;
  letter-spacing: 0.02em;
}

.ec-text span {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.ec-btn {
  height: 42px;
  padding: 0 20px;
  border: 1px solid var(--era-accent);
  border-radius: 999px;
  background: var(--era-accent);
  color: #06101a;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.14s ease, filter 0.2s ease;
}

.ec-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
}

.ec-btn:disabled {
  opacity: 0.5;
  pointer-events: none;
}

@keyframes continueIn {
  from {
    opacity: 0;
    transform: translateY(26px) scale(0.94);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes continueOut {
  to {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
}

@keyframes stampDrop {
  from {
    transform: scale(1.9) rotate(-14deg);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

.p-stamp.is-fresh .p-icon {
  animation: freshStamp 1.1s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

@keyframes freshStamp {
  0% {
    transform: scale(2.1) rotate(-16deg);
    box-shadow: 0 0 0 1px var(--era-accent), 0 0 34px rgba(143, 240, 255, 0.5);
  }
  55% {
    transform: scale(1) rotate(0);
    box-shadow: 0 0 0 1px var(--era-accent), 0 0 22px rgba(143, 240, 255, 0.32);
  }
  100% {
    box-shadow: 0 0 0 1px rgba(143, 240, 255, 0.12);
  }
}

@keyframes wovenGlow {
  0% {
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  45% {
    box-shadow: 0 0 0 3px rgba(179, 64, 47, 0.4), 0 24px 70px rgba(224, 164, 88, 0.45);
  }
  100% {
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(224, 164, 88, 0.28);
  }
}

@keyframes crtPass {
  0% {
    filter: brightness(1);
  }
  30% {
    filter: brightness(1.7);
  }
  100% {
    filter: brightness(1.12);
  }
}

@keyframes printedShake {
  0%, 100% {
    transform: translateY(0);
  }
  30% {
    transform: translateY(-4px);
  }
  60% {
    transform: translateY(2px);
  }
}

@keyframes msgIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* =========================================================
   era 1 · punch card
   ========================================================= */
.punch-scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.loom {
  position: relative;
  width: 100%;
  height: 104px;
  border: 1px solid rgba(224, 164, 88, 0.18);
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(224, 164, 88, 0.1), rgba(0, 0, 0, 0.12)),
    repeating-linear-gradient(0deg, transparent 0 20px, rgba(224, 164, 88, 0.05) 20px 21px);
  overflow: hidden;
}

.loom-beam {
  position: absolute;
  left: 8px;
  right: 8px;
  top: 9px;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(#a86b31, #3a2110);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.loom-beam.bottom {
  top: auto;
  bottom: 9px;
}

.threads {
  position: absolute;
  inset: 20px 12px;
  background: repeating-linear-gradient(90deg, transparent 0 11px, rgba(242, 226, 196, 0.26) 11px 12px);
  -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
}

.shuttle {
  position: absolute;
  top: 43%;
  left: 6%;
  width: 48px;
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(90deg, #e0a458, #fff0c2);
  box-shadow: 0 0 18px rgba(224, 164, 88, 0.4);
}

.loom.is-running .shuttle {
  animation: weave 1.15s ease-in-out infinite;
}

.punch-card {
  position: relative;
  width: min(100%, 540px);
  aspect-ratio: 1.58;
  padding: clamp(14px, 2.5vw, 22px);
  border-radius: 5px;
  background-color: #efe0c1;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 17px, rgba(43, 33, 24, 0.045) 17px 18px),
    radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.38), transparent 42%);
  color: #2b2118;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(43, 33, 24, 0.14);
  transform: rotate(-1.2deg);
  overflow: hidden;
}

.punch-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 5px;
  margin-bottom: 7px;
  border-bottom: 2px solid #b3402f;
}

.punch-card-title {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  color: #7a4b2a;
}

.punch-letter {
  font-family: var(--font-mono);
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  line-height: 1;
  color: #b3402f;
}

.binary-readout {
  margin: 2px 0 9px;
  font-family: var(--font-mono);
  font-size: clamp(13px, 2vw, 17px);
  letter-spacing: 0.34em;
  text-align: center;
  color: #2b2118;
}

.binary-readout small {
  display: block;
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: #7a4b2a;
}

.hole-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(6px, 1.2vw, 12px);
  margin-bottom: 16px;
}

.hole-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hole {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  border: 2px solid #b89a6a;
  border-radius: 50%;
  background: #d8c3a0;
  box-shadow: inset 0 2px 4px rgba(43, 33, 24, 0.18);
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
}

.hole:hover {
  transform: scale(1.04);
  border-color: #b3402f;
}

.hole small {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  color: #6a4a2a;
}

.hole.is-punched {
  background: #1a120b;
  border-color: #1a120b;
  box-shadow: inset 0 3px 7px #000, 0 0 0 2px rgba(179, 64, 47, 0.12);
}

.hole.is-punched small {
  color: #efe0c1;
}

.hole.is-target {
  animation: targetPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 0 3px rgba(179, 64, 47, 0.42);
}

.woven-stamp {
  position: absolute;
  right: 12px;
  bottom: 10px;
  padding: 3px 7px;
  border: 2px solid #b3402f;
  color: #b3402f;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  transform: rotate(-12deg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.punch-card.is-woven .woven-stamp {
  opacity: 0.85;
}

.punch-card.is-shaking {
  animation: shake 0.35s ease;
}

.letter-picker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.letter-picker label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--era-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.letter-picker select {
  height: 40px;
  min-width: 92px;
  padding: 0 10px;
  font-family: var(--font-mono);
  font-size: 14px;
}

.picker-note {
  color: var(--era-muted);
  font-size: 10px;
}

.codebook {
  font-size: 10px;
  color: var(--era-muted);
}

.codebook summary {
  cursor: pointer;
  color: var(--era-accent-2);
}

.codebook p {
  margin: 6px 0 0;
  font-family: var(--font-mono);
  line-height: 1.7;
  word-break: break-word;
}

.punch-workbench {
  position: relative;
  display: grid;
  gap: clamp(12px, 1.8vw, 18px);
  width: min(100%, 720px);
}

.punch-workbench .loom {
  height: 118px;
}

.card-instruction {
  display: grid;
  gap: 3px;
  margin: 0 0 8px;
  color: #7a4b2a;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  line-height: 1.6;
  text-align: center;
}

.card-instruction .ci-derive {
  color: #2b2118;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.card-instruction .ci-how {
  color: #7a4b2a;
}

.card-instruction code {
  padding: 0 3px;
  border: 1px solid rgba(122, 75, 42, 0.35);
  border-radius: 3px;
  background: rgba(122, 75, 42, 0.1);
}

.binary-readout {
  margin-top: 0;
}

.punch-card.is-woven {
  animation: wovenGlow 1s ease both;
}

.bench {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid rgba(122, 75, 42, 0.6);
  border-radius: 8px;
  background: linear-gradient(180deg, #3a2413, #221408);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 16px 32px rgba(0, 0, 0, 0.45);
}

.bench-slot {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bench-slot label {
  color: #b59a7a;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.bench-slot select {
  height: 38px;
  min-width: 86px;
  padding: 0 9px;
  border: 1px solid rgba(224, 164, 88, 0.42);
  border-radius: 6px;
  background: #1b1109;
  color: #f6e8d3;
  font-family: var(--font-mono);
  font-size: 14px;
}

.lever {
  margin-left: auto;
  padding: 11px 22px;
  border: 1px solid #7a4b2a;
  border-radius: 6px;
  background: linear-gradient(180deg, #e0a458, #a86b31);
  color: #1b1109;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 0 6px 0 #6a3d18, 0 14px 26px rgba(0, 0, 0, 0.45);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.lever:hover {
  transform: translateY(-1px);
}

.lever:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #6a3d18;
}

.lever:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.bench-btn {
  padding: 9px 13px;
  border: 1px dashed rgba(224, 164, 88, 0.42);
  border-radius: 6px;
  background: rgba(224, 164, 88, 0.06);
  color: #d8bd97;
  font-size: 11px;
  cursor: pointer;
}

.bench-btn:hover {
  background: rgba(224, 164, 88, 0.14);
}

.bench-btn:disabled {
  opacity: 0.4;
  pointer-events: none;
}

.bench-note {
  padding: 9px 4px;
  border: 0;
  background: none;
  color: #b59a7a;
  font-size: 11px;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

.bench-note:hover {
  color: #f2d0a4;
}

/* =========================================================
   era 2 · register
   ========================================================= */
.register-scene {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.crt-monitor {
  position: relative;
  padding: 13px;
  border: 1px solid #34402f;
  border-radius: 20px;
  background: linear-gradient(180deg, #20251d, #0a0d09);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(108, 255, 158, 0.07);
}

.crt-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.tube-row {
  display: flex;
  gap: 5px;
}

.tube {
  width: 9px;
  height: 21px;
  border-radius: 5px;
  background: radial-gradient(circle at 50% 30%, #ffe4ae, #c25b18 55%, #3a1204);
  opacity: 0.8;
  animation: tubeFlicker 3.2s ease-in-out infinite;
}

.tube:nth-child(2n) {
  animation-delay: 0.4s;
}

.tube:nth-child(3n) {
  animation-delay: 0.9s;
}

.crt-tag {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: rgba(108, 255, 158, 0.55);
}

.crt-screen {
  position: relative;
  overflow: hidden;
  padding: 15px;
  border: 1px solid rgba(108, 255, 158, 0.16);
  border-radius: 11px;
  background: #03110a;
  box-shadow: inset 0 0 50px rgba(108, 255, 158, 0.08);
}

.crt-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
  opacity: 0.5;
}

.registers {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
}

.reg {
  flex: 1;
  min-width: 0;
  padding: 8px 6px;
  border: 1px solid rgba(108, 255, 158, 0.22);
  border-radius: 7px;
  background: rgba(108, 255, 158, 0.03);
  text-align: center;
}

.reg-name {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: rgba(108, 255, 158, 0.7);
}

.reg-val {
  min-height: 1.2em;
  font-family: var(--font-mono);
  font-size: clamp(22px, 3.4vw, 32px);
  font-weight: 700;
  line-height: 1.25;
  color: #b7ffd0;
  text-shadow: 0 0 14px rgba(108, 255, 158, 0.5);
}

.reg.is-hot {
  animation: regGlow 0.6s ease;
}

.crt-log {
  position: relative;
  z-index: 1;
  min-height: 76px;
  margin-top: 11px;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.7;
  color: #6cff9e;
  white-space: pre-wrap;
}

.program-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.prog-slot {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 4px 7px;
  border: 1px dashed rgba(108, 255, 158, 0.26);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.02);
  font-family: var(--font-mono);
  font-size: 10px;
  color: #b7ffd0;
}

.prog-slot.is-filled {
  border-style: solid;
  background: rgba(108, 255, 158, 0.06);
}

.slot-index {
  width: 17px;
  flex: 0 0 auto;
  font-size: 8px;
  color: rgba(108, 255, 158, 0.5);
}

.slot-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.slot-actions {
  display: flex;
  gap: 2px;
}

.mini-btn {
  width: 23px;
  height: 23px;
  padding: 0;
  border: 1px solid rgba(108, 255, 158, 0.2);
  border-radius: 4px;
  background: transparent;
  color: #6cff9e;
  font-size: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.mini-btn:hover {
  background: rgba(108, 255, 158, 0.1);
}

.instr-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
}

.instr {
  padding: 8px;
  border: 1px solid rgba(108, 255, 158, 0.2);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.03);
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.instr:hover {
  border-color: #6cff9e;
  background: rgba(108, 255, 158, 0.1);
}

.instr.is-used {
  opacity: 0.28;
  pointer-events: none;
}

.crt-bay,
.console-desk {
  position: relative;
  z-index: 1;
}

.crt-bay {
  grid-area: bay;
  display: grid;
  gap: 12px;
  align-content: start;
}

.stencil {
  justify-self: stretch;
  display: grid;
  gap: 4px;
  padding: 10px 16px;
  border: 2px dashed rgba(108, 255, 158, 0.45);
  border-radius: 4px;
  background: rgba(108, 255, 158, 0.05);
  color: #d8ffe4;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.45;
  text-align: center;
}

.stencil span {
  color: #6cff9e;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-shadow: 0 0 14px rgba(108, 255, 158, 0.4);
}

.machine-brief {
  padding: 12px 14px;
  border: 1px solid var(--era-line);
  border-left: 3px solid rgba(108, 255, 158, 0.55);
  border-radius: 8px;
  background: rgba(108, 255, 158, 0.04);
}

.machine-brief > b {
  display: block;
  margin-bottom: 7px;
  color: #6cff9e;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.machine-brief ul {
  display: grid;
  gap: 5px;
  margin: 0;
  padding-left: 16px;
  color: var(--era-muted);
  font-size: 12px;
  line-height: 1.65;
}

.machine-brief code {
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(108, 255, 158, 0.12);
  color: #b7ffd0;
}

.desk-label {
  color: rgba(108, 255, 158, 0.55);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.console-desk {
  grid-area: desk;
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid rgba(108, 255, 158, 0.24);
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(16, 32, 22, 0.92), rgba(3, 14, 8, 0.94));
  box-shadow: inset 0 1px 0 rgba(108, 255, 158, 0.1), 0 20px 50px rgba(0, 0, 0, 0.45);
}

.patch-bay {
  display: grid;
  gap: 6px;
}

.patch {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 5px 8px;
  border: 1px dashed rgba(108, 255, 158, 0.26);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.02);
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 11px;
}

.patch.is-wired {
  border-style: solid;
  border-color: rgba(108, 255, 158, 0.4);
  background: linear-gradient(90deg, rgba(108, 255, 158, 0.14), rgba(108, 255, 158, 0.02));
}

.patch-index {
  flex: 0 0 auto;
  width: 20px;
  color: rgba(108, 255, 158, 0.5);
  font-size: 9px;
}

.patch-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.patch-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 3px;
}

.switchboard {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  padding: 10px;
  border: 1px solid rgba(108, 255, 158, 0.18);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.4);
}

.switch {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 9px 10px 30px;
  border: 1px solid rgba(108, 255, 158, 0.24);
  border-radius: 5px;
  background: #07150d;
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, opacity 0.2s;
}

.switch i {
  position: absolute;
  left: 9px;
  top: 50%;
  width: 12px;
  height: 17px;
  margin-top: -8px;
  border-radius: 2px;
  background: linear-gradient(180deg, #d8ffe4, #4f8a66);
  box-shadow: 0 0 8px rgba(108, 255, 158, 0.4);
  transition: transform 0.15s ease;
}

.switch:hover {
  border-color: #6cff9e;
  background: rgba(108, 255, 158, 0.1);
}

.switch.is-on {
  opacity: 0.3;
  pointer-events: none;
}

.switch.is-on i {
  transform: translateY(5px);
}

.switch:disabled {
  opacity: 0.3;
  pointer-events: none;
}

.switch-body {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.switch-text {
  font-size: 11px;
  font-weight: 700;
}

.switch-effect {
  color: rgba(108, 255, 158, 0.6);
  font-size: 9px;
  letter-spacing: 0.04em;
}

.patch-effect {
  flex: 0 0 auto;
  min-width: 74px;
  color: rgba(108, 255, 158, 0.6);
  font-size: 9px;
  letter-spacing: 0.04em;
  text-align: right;
}

.patch-empty {
  color: rgba(108, 255, 158, 0.32);
}

.console-hint {
  padding: 12px 14px;
  border: 1px solid rgba(255, 139, 139, 0.4);
  border-left: 3px solid #ff8b8b;
  border-radius: 8px;
  background: rgba(255, 139, 139, 0.07);
  animation: popIn 0.3s ease both;
}

.hint-head {
  margin-bottom: 5px;
  color: #ff8b8b;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.hint-cause {
  color: #ffe9d8;
  font-size: 12.5px;
  line-height: 1.7;
}

.hint-plan {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(108, 255, 158, 0.3);
  color: #b7ffd0;
  font-size: 12px;
  line-height: 1.7;
}

.console-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.big-red {
  padding: 12px 26px;
  border: 2px solid #ff7a5a;
  border-radius: 8px;
  background: radial-gradient(circle at 38% 28%, #ff9370, #b32a12 72%);
  color: #fff3ea;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.16em;
  cursor: pointer;
  box-shadow: 0 8px 0 #6a1608, 0 18px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.big-red:hover {
  transform: translateY(-1px);
}

.big-red:active {
  transform: translateY(5px);
  box-shadow: 0 3px 0 #6a1608;
}

.big-red:disabled {
  opacity: 0.42;
  pointer-events: none;
}

.console-btn {
  padding: 10px 14px;
  border: 1px solid rgba(108, 255, 158, 0.32);
  border-radius: 6px;
  background: rgba(108, 255, 158, 0.05);
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
}

.console-btn:hover {
  background: rgba(108, 255, 158, 0.13);
}

.console-btn:disabled {
  opacity: 0.35;
  pointer-events: none;
}

.crt-screen.is-passed {
  animation: crtPass 0.9s ease both;
  box-shadow: inset 0 0 80px rgba(108, 255, 158, 0.32);
}

.crt-monitor {
  width: 100%;
}

/* =========================================================
   era 3 · unix
   ========================================================= */
.unix-scene {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.term-window {
  overflow: hidden;
  border: 1px solid #3a3320;
  border-radius: 10px;
  background: #0b0b08;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.term-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid #2a2416;
  background: #1a1a10;
  color: #a69b78;
  font-family: var(--font-mono);
  font-size: 9px;
}

.term-dots {
  display: flex;
  gap: 4px;
}

.term-dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5a4a2a;
}

.term-title {
  margin-left: 5px;
  letter-spacing: 0.07em;
}

.term-body {
  max-height: 238px;
  overflow: auto;
  padding: 13px 15px;
  background: radial-gradient(circle at 20% 0%, rgba(240, 198, 116, 0.06), transparent 60%);
  color: #f0c674;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.75;
}

.log-line {
  padding: 1px 2px;
  border-radius: 2px;
  white-space: pre;
  transition: background 0.2s, color 0.2s;
}

.log-line.is-hit {
  background: rgba(240, 198, 116, 0.14);
  color: #fff0c2;
}

.pipeline-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-height: 42px;
  padding: 9px 13px;
  border-top: 1px solid #2a2416;
  background: #070704;
  color: #fff0c2;
  font-family: var(--font-mono);
  font-size: 10px;
}

.pipe-cmd {
  padding: 3px 6px;
  border: 1px solid rgba(240, 198, 116, 0.25);
  border-radius: 4px;
  background: rgba(240, 198, 116, 0.06);
}

.pipe-sep {
  color: #a69b78;
}

.term-output {
  min-height: 42px;
  padding: 9px 13px;
  border-top: 1px solid #2a2416;
  color: #b7ffd0;
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: pre-wrap;
}

.command-tray {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.cmd {
  padding: 7px 8px;
  border: 1px solid var(--era-line);
  border-radius: 6px;
  background: rgba(240, 198, 116, 0.04);
  color: var(--era-text);
  font-family: var(--font-mono);
  font-size: 10px;
  cursor: pointer;
}

.cmd:hover {
  border-color: var(--era-accent);
  background: rgba(240, 198, 116, 0.1);
}

.teletype {
  width: min(100%, 880px);
  display: grid;
  border: 1px solid #4a4026;
  border-radius: 12px;
  background: linear-gradient(180deg, #241f12, #100e08);
  box-shadow: 0 28px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(240, 198, 116, 0.12);
  overflow: hidden;
}

.tt-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid #4a4026;
  background: #322b16;
  color: #f0c674;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
}

.tt-head span {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #a69b78;
}

.paper-tape {
  position: relative;
  max-height: 246px;
  overflow: auto;
  padding: 16px 32px;
  background: repeating-linear-gradient(0deg, #efe6cf 0 25px, #e4dac0 25px 26px);
  color: #33291a;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.72;
}

.paper-tape::before,
.paper-tape::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 12px;
  background-image: radial-gradient(circle, rgba(35, 28, 16, 0.5) 0 1.9px, transparent 2.4px);
  background-size: 12px 15px;
  background-repeat: repeat-y;
  background-position: center top;
}

.paper-tape::before {
  left: 0;
}

.paper-tape::after {
  right: 0;
}

.room-unix .log-line {
  white-space: pre-wrap;
  word-break: break-word;
  color: #3a2f1c;
}

.room-unix .log-line.is-hit {
  background: rgba(179, 64, 47, 0.22);
  color: #7a1f10;
  font-weight: 700;
}

.pipe-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  min-height: 46px;
  padding: 10px 14px;
  border-top: 1px solid #4a4026;
  background: #0c0b06;
  font-family: var(--font-mono);
  font-size: 11px;
}

.pipe-line .pipe-cmd {
  border-color: rgba(240, 198, 116, 0.3);
  color: #fff0c2;
}

.printout {
  min-height: 58px;
  padding: 12px 14px;
  border-top: 1px solid #4a4026;
  background: #070603;
  color: #f0c674;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.teletype.is-printed {
  border-color: rgba(240, 198, 116, 0.75);
  animation: printedShake 0.5s ease;
}

.teletype.is-printed .printout {
  background: rgba(143, 240, 168, 0.07);
  color: #a8ffbf;
  font-size: 15px;
  font-weight: 700;
}

.kbd {
  width: min(100%, 880px);
  display: grid;
  gap: 12px;
  padding: 16px;
  border: 1px solid #4a4026;
  border-radius: 14px;
  background: linear-gradient(180deg, #2b2415, #171308);
  box-shadow: 0 20px 42px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.kbd-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.key {
  min-width: 108px;
  padding: 12px 10px 14px;
  border: 1px solid #5a4c28;
  border-radius: 7px;
  background: linear-gradient(180deg, #ece2c8, #c9b98f);
  color: #241d10;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 5px 0 #6a5a30, 0 12px 20px rgba(0, 0, 0, 0.45);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.key:hover {
  transform: translateY(-1px);
}

.key:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #6a5a30;
}

.key:disabled {
  opacity: 0.4;
  pointer-events: none;
}

.kbd-actions {
  padding-top: 4px;
  border-top: 1px dashed rgba(240, 198, 116, 0.2);
}

.enter-key {
  padding: 12px 24px;
  border: 1px solid #7a4b1a;
  border-radius: 7px;
  background: linear-gradient(180deg, #f0c674, #bd8a2e);
  color: #1b1508;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 0 5px 0 #6a4a16, 0 12px 22px rgba(0, 0, 0, 0.45);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.enter-key:hover {
  transform: translateY(-1px);
}

.enter-key:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #6a4a16;
}

.enter-key:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.kbd-btn {
  padding: 11px 14px;
  border: 1px solid #5a4c28;
  border-radius: 7px;
  background: #1f1a0f;
  color: #c8b88f;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 4px 0 #12100a;
}

.kbd-btn:hover {
  color: #fff0c2;
  border-color: #f0c674;
}

.kbd-btn:disabled {
  opacity: 0.4;
  pointer-events: none;
}

.unix-brief {
  width: min(100%, 880px);
  padding: 12px 16px;
  border: 1px solid var(--era-line);
  border-left: 3px solid rgba(240, 198, 116, 0.6);
  border-radius: 10px;
  background: rgba(240, 198, 116, 0.05);
}

.unix-brief > b {
  display: block;
  margin-bottom: 5px;
  color: #f0c674;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.unix-brief p {
  margin: 0;
  color: #ddd2b0;
  font-size: 13px;
  line-height: 1.75;
}

.unix-brief code {
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(240, 198, 116, 0.14);
  color: #fff0c2;
  font-size: 11px;
}

.kbd-label {
  color: #a69b78;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
}

.key {
  display: grid;
  gap: 3px;
  justify-items: center;
}

.key-text {
  font-size: 12px;
  font-weight: 700;
}

.key-man {
  color: #6a5a30;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.02em;
}

.unix-hint {
  width: min(100%, 880px);
  padding: 12px 15px;
  border: 1px solid rgba(255, 139, 139, 0.45);
  border-left: 3px solid #ff8b8b;
  border-radius: 10px;
  background: rgba(255, 139, 139, 0.07);
  animation: popIn 0.3s ease both;
}

.unix-hint .hint-cause {
  color: #ffe9d8;
}

.unix-hint .hint-plan {
  border-top-color: rgba(240, 198, 116, 0.3);
  color: #fff0c2;
  font-family: var(--font-mono);
  font-size: 11px;
}

.unix-hint .hint-plan code {
  color: #f0c674;
}

/* =========================================================
   era 4 · web
   ========================================================= */
.web-scene {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.browser-window {
  overflow: hidden;
  border: 1px solid #888;
  border-radius: 6px;
  background: #c0c0c0;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  color: #000;
}

.browser-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-bottom: 1px solid #777;
  background: linear-gradient(#f2f2f2, #bfbfbf);
  color: #222;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 9px;
}

.browser-dots {
  display: flex;
  gap: 3px;
}

.browser-dots i {
  width: 7px;
  height: 7px;
  border: 1px solid #555;
  border-radius: 50%;
  background: #888;
}

.browser-title {
  flex: 1;
  min-width: 0;
  padding: 2px 5px;
  border: 1px solid #888;
  border-radius: 2px;
  background: #fff;
  color: #333;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.browser-page {
  position: relative;
  min-height: 318px;
  padding: 20px;
  overflow: hidden;
  background: #fff;
  color: #000;
  font-family: "Times New Roman", "Songti SC", serif;
  transition: background 0.3s, color 0.3s;
}

.browser-page.bg-stars {
  background:
    radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 1.6px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 60%, #fff 0 1px, transparent 1.6px) 0 0 / 63px 63px,
    #000;
  color: #fff;
}

.browser-page.bg-stars .web-title {
  color: #ffff00;
}

.browser-page.bg-stars .web-link {
  color: #00ffff;
}

.browser-page.bg-stars .web-bio {
  color: #e8e8e8;
}

.browser-page.bg-clouds {
  background:
    radial-gradient(ellipse at 18% 18%, #fff 0 18%, transparent 19%),
    radial-gradient(ellipse at 78% 28%, #fff 0 14%, transparent 15%),
    linear-gradient(#7ec8ff, #dff3ff);
  color: #002244;
}

.browser-page.bg-checker {
  background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 32px 32px;
  color: #111;
}

.web-title {
  margin: 0 0 10px;
  color: #000080;
  font-size: clamp(21px, 3.4vw, 32px);
  line-height: 1.2;
  text-decoration: underline;
}

.web-marquee {
  margin-bottom: 10px;
  padding: 3px 0;
  overflow: hidden;
  border: 1px dashed #999;
  color: #b30000;
  font-family: Arial, sans-serif;
  font-size: 11px;
  white-space: nowrap;
}

.web-marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 9s linear infinite;
}

.web-bio {
  max-width: 60ch;
  margin: 7px 0 11px;
  font-size: 14px;
  line-height: 1.7;
}

.web-link {
  display: inline-block;
  margin-bottom: 11px;
  color: #0000ee;
  font-family: Arial, sans-serif;
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
}

.hit-counter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 11px;
  padding: 3px 5px;
  border: 1px solid #0a0;
  background: #000;
  color: #0f0;
  font-family: var(--font-mono);
  font-size: 11px;
}

.hit-digit {
  padding: 0 2px;
  background: #111;
}

.web-guestbook {
  margin-left: 6px;
  padding: 4px 7px;
  border: 2px outset #ccc;
  background: #e8e8e8;
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 10px;
  cursor: pointer;
}

.construction {
  position: absolute;
  right: 12px;
  bottom: 12px;
  padding: 5px 8px;
  border: 2px solid #000;
  background: repeating-linear-gradient(45deg, #ffd800 0 8px, #111 8px 16px);
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 800;
  transform: rotate(-6deg);
  box-shadow: 2px 2px 0 #000;
  transition: opacity 0.3s, transform 0.3s;
}

.construction.is-hidden {
  opacity: 0;
  transform: rotate(-6deg) scale(0.8);
  pointer-events: none;
}

.web-empty {
  padding-top: 86px;
  color: #888;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}

.published-banner {
  display: inline-block;
  margin-bottom: 8px;
  padding: 3px 6px;
  border: 1px solid #000;
  background: #ff0;
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 10px;
  animation: popIn 0.3s ease both;
}

.web-blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.block-chip {
  padding: 7px 8px;
  border: 1px solid var(--era-line);
  border-radius: 6px;
  background: rgba(0, 229, 255, 0.03);
  color: var(--era-text);
  font-size: 10px;
  cursor: pointer;
}

.block-chip.is-on {
  border-color: var(--era-accent);
  background: rgba(0, 229, 255, 0.12);
  color: var(--era-accent-2);
}

.block-chip .req {
  color: var(--era-accent-2);
}

.web-fields {
  display: grid;
  gap: 6px;
}

.field {
  display: grid;
  gap: 3px;
}

.field label {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.field input,
.field textarea {
  width: 100%;
  height: 36px;
  padding: 7px 9px;
  font-size: 11px;
}

.field textarea {
  height: 58px;
  resize: vertical;
}

.bg-picker {
  display: flex;
  gap: 6px;
}

.bg-swatch {
  width: 42px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--era-line);
  border-radius: 4px;
  cursor: pointer;
}

.bg-swatch.stars {
  background: radial-gradient(circle, #fff 0 1px, transparent 1.4px) 0 0 / 10px 10px, #000;
}

.bg-swatch.clouds {
  background: linear-gradient(#7ec8ff, #dff3ff);
}

.bg-swatch.checker {
  background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 10px 10px;
}

.bg-swatch.is-on {
  outline: 2px solid var(--era-accent);
  outline-offset: 2px;
}

.desktop {
  display: contents;
}

.desktop-icons {
  grid-area: icons;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 6px 4px;
}

.dicon {
  display: grid;
  justify-items: center;
  gap: 5px;
  color: #cfe3ff;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 10px;
  text-align: center;
  opacity: 0.85;
}

.dicon-glyph {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 4px;
  background: linear-gradient(135deg, #3a4a9a, #161e42);
  color: #9fe8ff;
  font-size: 17px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

.room-web .browser-window {
  grid-area: browser;
  border-color: #6f6f6f;
  box-shadow: 0 26px 56px rgba(0, 0, 0, 0.55);
}

.toolbox {
  grid-area: tools;
  overflow: hidden;
  border: 1px solid #6f6f6f;
  border-radius: 4px;
  background: #d4d0c8;
  color: #12162a;
  box-shadow: 0 22px 46px rgba(0, 0, 0, 0.5), inset 1px 1px 0 #fff;
}

.toolbox-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 9px;
  background: linear-gradient(90deg, #0a2a8a, #4a86e8);
  color: #fff;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 11px;
  font-weight: 700;
}

.toolbox-head span {
  font-size: 9px;
  font-weight: 400;
  opacity: 0.82;
}

.toolbox-body {
  display: grid;
  gap: 10px;
  padding: 11px;
}

.tb-label {
  color: #3a3f52;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.toolbox-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  padding-top: 3px;
  border-top: 1px solid #a8a49c;
}

.tb-btn {
  padding: 7px 13px;
  border: 2px outset #ececec;
  border-radius: 2px;
  background: #dcdcdc;
  color: #12162a;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 11px;
  cursor: pointer;
}

.tb-btn:active {
  border-style: inset;
}

.tb-btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.upload-btn {
  padding: 8px 20px;
  border: 2px outset #ffe9a8;
  border-radius: 2px;
  background: linear-gradient(#ffd75e, #e0a458);
  color: #2a1a04;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
}

.upload-btn:active {
  border-style: inset;
}

.upload-btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.toolbox .block-chip {
  padding: 6px 9px;
  border: 2px outset #ececec;
  border-radius: 2px;
  background: #cfcfcf;
  color: #12162a;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 10px;
}

.toolbox .block-chip.is-on {
  border-style: inset;
  background: #8fd6ff;
  color: #08243c;
}

.toolbox .block-chip .req {
  color: #b30000;
}

.toolbox .field label {
  color: #3a3f52;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0;
  text-transform: none;
}

.toolbox .field input,
.toolbox .field textarea {
  border: 2px inset #b5b5b5;
  border-radius: 0;
  background: #fff;
  color: #000;
  font-family: Arial, "PingFang SC", sans-serif;
  font-size: 11px;
}

.toolbox .bg-swatch {
  border: 2px outset #ececec;
  border-radius: 0;
}

.toolbox .bg-swatch.is-on {
  border-style: inset;
  outline: 2px solid #0a2a8a;
  outline-offset: 1px;
}

.taskbar {
  grid-area: bar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 10px;
  border-top: 1px solid #8f8f8f;
  background: linear-gradient(#d8d8d8, #a8a8a8);
  color: #101528;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  font-size: 10px;
}

.taskbar-clock {
  padding: 2px 9px;
  border: 1px inset #bbb;
  background: #c8c8c8;
  font-family: var(--font-mono);
}

.desktop.is-published .browser-window {
  box-shadow: 0 0 0 2px rgba(108, 255, 158, 0.6), 0 26px 56px rgba(0, 0, 0, 0.55);
}

/* =========================================================
   era 5 · cloud
   ========================================================= */
.cloud-scene {
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 18px;
  align-items: center;
}

.phone {
  position: relative;
  width: 116px;
  height: 224px;
  margin: 0 auto;
  padding: 8px;
  border: 1px solid #666;
  border-radius: 22px;
  background: linear-gradient(160deg, #2a2a2a, #050505);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 2px #111;
}

.phone-notch {
  position: absolute;
  top: 8px;
  left: 50%;
  z-index: 2;
  width: 44px;
  height: 10px;
  border-radius: 0 0 8px 8px;
  background: #050505;
  transform: translateX(-50%);
}

.phone-screen {
  position: relative;
  height: 100%;
  overflow: hidden;
  border-radius: 16px;
  background: radial-gradient(circle at 50% 20%, #12314a, #050b12 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background 0.4s;
}

.phone-status {
  position: absolute;
  top: 12px;
  left: 11px;
  right: 11px;
  display: flex;
  justify-content: space-between;
  color: #8fd8ff;
  font-family: var(--font-mono);
  font-size: 7px;
  opacity: 0.75;
}

.app-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #6fc3ff, #b18cff);
  color: #04101c;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  box-shadow: 0 8px 24px rgba(111, 195, 255, 0.35);
  transition: transform 0.3s, box-shadow 0.3s;
}

.app-name {
  color: #bfe9ff;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.08em;
}

.phone.is-live .app-icon {
  transform: scale(1.08);
  box-shadow: 0 0 32px rgba(143, 240, 255, 0.75);
}

.phone.is-live .phone-screen {
  background: radial-gradient(circle at 50% 20%, #145a3a, #050b12 70%);
}

.cloud-area {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.cloud-glow {
  position: absolute;
  top: -24px;
  left: 8%;
  right: 8%;
  height: 100px;
  background: radial-gradient(ellipse, rgba(111, 195, 255, 0.26), transparent 70%);
  filter: blur(18px);
  pointer-events: none;
}

.server-racks {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 7px;
}

.rack {
  position: relative;
  width: 40px;
  height: 62px;
  border: 1px solid rgba(111, 195, 255, 0.3);
  border-radius: 6px;
  background: linear-gradient(#0d2740, #071523);
  transition: opacity 0.2s, box-shadow 0.2s;
}

.rack::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 6px;
  right: 6px;
  height: 4px;
  border-radius: 2px;
  background: rgba(111, 195, 255, 0.14);
  box-shadow: 0 10px 0 rgba(111, 195, 255, 0.14), 0 20px 0 rgba(111, 195, 255, 0.14), 0 30px 0 rgba(111, 195, 255, 0.14);
}

.rack-led {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6cff9e;
  box-shadow: 0 0 6px #6cff9e;
}

.rack.is-off {
  opacity: 0.24;
}

.rack.is-off .rack-led {
  background: #555;
  box-shadow: none;
}

.rack.is-hot {
  box-shadow: 0 0 20px rgba(111, 195, 255, 0.4);
}

.cloud-chart {
  display: block;
  width: 100%;
  height: 104px;
  border: 1px solid var(--era-line);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.22);
}

.cloud-readout {
  display: flex;
  gap: 6px;
}

.readout {
  flex: 1;
  min-width: 0;
  padding: 7px 5px;
  border: 1px solid var(--era-line);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  text-align: center;
}

.readout b {
  display: block;
  margin-top: 2px;
  color: var(--era-text);
  font-size: 15px;
}

.cloud-controls {
  display: grid;
  gap: 9px;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.range-row label {
  flex: 0 0 auto;
  color: var(--era-muted);
  font-size: 10px;
}

.range-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--era-accent);
}

.budget-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 10px;
}

.budget-line b {
  color: var(--era-accent-2);
}

.switch-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--era-muted);
  font-size: 10px;
}

.switch-row input {
  accent-color: var(--era-accent);
}

.dash-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  border: 1px solid var(--era-line);
  border-radius: 12px;
  background: rgba(111, 195, 255, 0.07);
  color: var(--era-accent-2);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.dash-head span {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--era-muted);
}

.dash-grid {
  display: grid;
  grid-template-columns: 148px minmax(0, 1.24fr) minmax(250px, 0.76fr);
  gap: 14px;
  align-items: start;
}

.dash-phone,
.dash-chart,
.dash-settings {
  padding: 14px;
  border: 1px solid var(--era-line);
  border-radius: 14px;
  background: var(--era-panel);
  box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.3);
}

.dash-phone {
  display: grid;
  place-items: center;
  gap: 10px;
}

.dash-chart {
  position: relative;
  display: grid;
  gap: 10px;
  align-content: start;
  overflow: hidden;
}

.dash-chart .cloud-glow {
  top: -34px;
}

.dash-settings {
  display: grid;
  gap: 11px;
  align-content: start;
}

.settings-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--era-line);
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.settings-head span {
  color: var(--era-muted);
  font-size: 9px;
  letter-spacing: 0.12em;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--era-muted);
  font-size: 11px;
}

.setting-row b {
  color: var(--era-text);
  font-family: var(--font-mono);
}

.setting-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--era-accent);
}

.setting-row.switch-row,
.setting-row.budget-line {
  justify-content: flex-start;
}

.setting-row.budget-line {
  justify-content: space-between;
  padding-top: 9px;
  border-top: 1px dashed var(--era-line);
  font-family: var(--font-mono);
}

.dash-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.dash-note {
  color: var(--era-muted);
  font-size: 10px;
  line-height: 1.7;
}

/* =========================================================
   era 6 · AI
   ========================================================= */
.ai-scene {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.ai-orb {
  position: absolute;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(143, 240, 255, 0.5), rgba(192, 132, 252, 0.24) 45%, transparent 70%);
  filter: blur(32px);
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
}

.ai-poster-wrap {
  position: relative;
  z-index: 1;
  width: min(100%, 350px);
  overflow: hidden;
  border: 1px solid var(--era-line);
  border-radius: 12px;
  background: #05060a;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.ai-poster {
  display: block;
  width: 100%;
  height: auto;
}

.ai-caption {
  position: relative;
  z-index: 1;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
}

.ai-caption span {
  color: var(--era-accent);
}

.prompt-console {
  position: relative;
  display: grid;
  gap: 7px;
  padding: 14px;
  border: 1px solid var(--era-line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.025);
  overflow: hidden;
}

.prompt-console::before {
  content: "";
  position: absolute;
  inset: -50% -20%;
  pointer-events: none;
  background:
    radial-gradient(circle at 30% 20%, rgba(143, 240, 255, 0.14), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.12), transparent 45%);
}

.prompt-console > * {
  position: relative;
  z-index: 1;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.chip {
  padding: 6px 8px;
  border: 1px solid var(--era-line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--era-muted);
  font-size: 10px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.chip.is-on {
  border-color: var(--era-accent);
  background: rgba(143, 240, 255, 0.1);
  color: var(--era-accent-2);
  box-shadow: 0 0 18px rgba(143, 240, 255, 0.08);
}

.prompt-input {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  padding: 9px;
  font-size: 12px;
  line-height: 1.6;
}

.suggestion-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.suggestion {
  padding: 4px 6px;
  border: 1px dashed var(--era-line);
  border-radius: 5px;
  background: transparent;
  color: var(--era-muted);
  font-size: 9px;
  line-height: 1.5;
  text-align: left;
  cursor: pointer;
}

.suggestion:hover {
  color: var(--era-text);
  border-color: var(--era-accent);
}

.ai-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.ai-plan {
  min-height: 116px;
  padding: 12px;
  border: 1px solid var(--era-line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.025);
}

.plan-title {
  margin-bottom: 8px;
  color: var(--era-accent-2);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.5;
}

.plan-step {
  display: flex;
  gap: 7px;
  margin-top: 6px;
  color: var(--era-muted);
  font-size: 10px;
  line-height: 1.6;
}

.step-num {
  flex: 0 0 auto;
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
}

.ai-note {
  color: var(--era-muted);
  font-size: 9px;
  line-height: 1.6;
  opacity: 0.8;
}

.chat-shell {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: 500px;
  overflow: hidden;
  border: 1px solid var(--era-line);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.028);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
}

.chat-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--era-line);
  background: rgba(143, 240, 255, 0.05);
  color: var(--era-accent-2);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.2em;
}

.chat-head span {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--era-muted);
  text-transform: uppercase;
}

.chat-log {
  display: grid;
  align-content: start;
  gap: 13px;
  max-height: 42vh;
  padding: 18px;
  overflow: auto;
}

.msg {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  animation: msgIn 0.32s ease both;
}

.msg.user {
  grid-template-columns: minmax(0, 1fr) 30px;
}

.msg.user .msg-avatar {
  order: 2;
}

.msg.user .msg-body {
  order: 1;
  justify-self: end;
  border-color: rgba(143, 240, 255, 0.34);
  background: rgba(143, 240, 255, 0.09);
}

.msg-avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--era-line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.045);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 800;
}

.msg.ai .msg-avatar {
  border-color: rgba(192, 132, 252, 0.4);
  color: var(--era-accent-2);
  background: rgba(192, 132, 252, 0.1);
}

.msg-body {
  max-width: 68ch;
  padding: 11px 14px;
  border: 1px solid var(--era-line);
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.035);
  color: var(--era-text);
  font-size: 13px;
  line-height: 1.75;
}

.msg-body em {
  display: block;
  margin-top: 5px;
  color: var(--era-muted);
  font-size: 10px;
  font-style: normal;
}

.msg.is-plan .msg-body {
  border-color: rgba(192, 132, 252, 0.36);
  background: linear-gradient(180deg, rgba(192, 132, 252, 0.08), rgba(255, 255, 255, 0.02));
}

.plan-foot {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--era-line);
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
}

.adopted {
  color: var(--era-ok);
  font-size: 12px;
  font-weight: 700;
}

.chat-composer {
  display: grid;
  gap: 11px;
  padding: 15px 18px;
  border-top: 1px solid var(--era-line);
  background: rgba(0, 0, 0, 0.3);
}

.composer-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

.chip-set {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.chip-label {
  margin-right: 2px;
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
}

.composer-input {
  width: 100%;
  min-height: 62px;
  padding: 11px 12px;
  font-size: 13px;
  line-height: 1.65;
  resize: vertical;
}

.composer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chat-shell.is-adopted {
  border-color: rgba(143, 240, 255, 0.5);
  box-shadow: 0 30px 90px rgba(143, 240, 255, 0.14);
}

.chat-attachment {
  position: sticky;
  top: calc(var(--topbar-h) + 14px);
  display: grid;
  gap: 9px;
  padding: 14px;
  border: 1px solid var(--era-line);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.03);
}

.attach-label {
  color: var(--era-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.chat-attachment .ai-poster {
  border: 1px solid var(--era-line);
  border-radius: 10px;
  box-shadow: 0 20px 46px rgba(0, 0, 0, 0.5);
}

/* =========================================================
   result
   ========================================================= */
.result-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 54px) clamp(14px, 3vw, 24px) 80px;
}

.shared-banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 22px;
  padding: 10px 13px;
  border: 1px solid var(--era-line);
  border-radius: 9px;
  background: rgba(143, 240, 255, 0.06);
  color: var(--era-muted);
  font-size: 11px;
}

.shared-banner b {
  color: var(--era-accent-2);
}

.result-head {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.result-kicker {
  color: var(--era-accent);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.26em;
}

.result-title {
  margin: 10px 0 11px;
  font-size: clamp(34px, 5.5vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.045em;
}

.result-sub {
  margin: 0;
  color: var(--era-muted);
  font-size: 13px;
  line-height: 1.7;
}

.result-grid {
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  gap: 16px;
  margin-top: 30px;
}

.result-card {
  padding: 22px;
  border: 1px solid var(--era-line);
  border-radius: 18px;
  background: var(--era-panel);
  backdrop-filter: blur(10px);
